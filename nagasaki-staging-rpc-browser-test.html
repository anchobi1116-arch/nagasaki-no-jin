<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>長崎の陣｜Supabase接続テスト</title>
<style>
body{font-family:system-ui,sans-serif;background:#f3f5fa;color:#17233b;max-width:720px;margin:30px auto;padding:15px}
main{background:white;padding:24px;border-radius:15px}
input{box-sizing:border-box;width:100%;padding:12px;margin:10px 0}
button{padding:12px;margin:6px;background:#17375f;color:white;border:0;border-radius:8px}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h2>🐺 長崎の陣｜検証用接続テスト</h2>
<p>検証用Supabaseにのみ接続します。本番データは変更しません。</p>
<p>保存しておいた Publishable key を入力してね。</p>
<input id="key" type="password" placeholder="sb_publishable_..." autocomplete="off">
<button id="run">公開プロフィールを取得</button>
<button id="clear">キーを消す</button>
<pre id="result">未実行</pre>
</main>
<script>
const keyInput=document.getElementById('key');
const result=document.getElementById('result');
document.getElementById('clear').onclick=()=>{
 keyInput.value='';
 result.textContent='キーを消しました';
};
document.getElementById('run').onclick=async()=>{
 const key=keyInput.value.trim();
 if(!key.startsWith('sb_publishable_')){
  result.textContent='Publishable keyを入力してください';
  return;
 }
 result.textContent='接続中...';
 try{
  const response=await fetch(
   'https://kozuqolhhdonnaxfjevi.supabase.co/rest/v1/rpc/get_staging_public_dogs',
   {
    method:'POST',
    headers:{'apikey':key,'Content-Type':'application/json'},
    body:'{}'
   }
  );
  const data=await response.json();
  if(!response.ok){
   result.textContent='HTTP '+response.status+'：'+(data.message||'エラー');
   return;
  }
  const dog=Array.isArray(data)?data.find(x=>x.name==='テストハスキー'):null;
  if(!dog){result.textContent='テストハスキーが見つかりません';return;}
  const safe=dog.residence_prefecture==null&&dog.instagram_handle==null&&dog.x_handle==null;
  result.textContent=
   (safe?'✅ 非公開情報は返されていません':'⚠️ 公開設定を再確認してください')+
   '\n犬名：'+dog.name+
   '\n犬種：'+dog.breed+
   '\n居住地：'+(dog.residence_prefecture??'非公開')+
   '\nInstagram：'+(dog.instagram_handle??'非公開')+
   '\nX：'+(dog.x_handle??'非公開');
 }catch(error){
  result.textContent='接続エラー：'+error.message;
 }
};
</script>
</body>
</html>
