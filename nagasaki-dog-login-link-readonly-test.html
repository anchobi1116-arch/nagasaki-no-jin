<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>長崎の陣｜ログイン・犬ID照合（読み取り専用）</title><style>body{margin:0;background:#f4f6fb;color:#18273f;font-family:system-ui,'Meiryo',sans-serif;line-height:1.7}.wrap{max-width:690px;margin:35px auto;padding:0 16px}.card{background:white;border:1px solid #dee4ed;border-radius:16px;padding:24px;margin-bottom:14px}h1{font-size:23px;margin:0 0 8px}h2{font-size:17px}.muted{font-size:13px;color:#546178}.notice{background:#f3f6fb;border-radius:9px;padding:12px;margin-top:12px}button{background:#194675;color:#fff;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #e5e8ef;padding:9px;text-align:left;word-break:break-word}.status{font-weight:700}code{font-size:12px;overflow-wrap:anywhere}.danger{color:#9b322e}.ok{color:#175b35}</style></head><body><main class="wrap"><section class="card"><h1>🐺 長崎の陣｜ログインと犬IDの照合</h1><p>プロフィールのクラウド連携前に、現在のログイン状態と、承認された犬との紐づけだけを確認するテストページです。</p><div class="notice"><strong>読み取り専用</strong><p class="muted">データの登録・更新・削除、登録コードの使用、認証メールの送信は行いません。現在の本番Supabaseに対してログイン状態と本人に許可された紐づけを照会します。新しい検証環境や課金は作成しません。</p></div><p><button id="run">🔎 ログインと犬IDを確認</button></p><p id="status" role="status" class="status">未確認</p></section><section class="card"><h2>確認結果</h2><div id="result" class="muted">まだ照合していません。</div><p class="muted">ログイン済みなのに「ログインなし」と出る場合は、このページとログインに使った画面のURLが同じドメインか確認してください。別のドメインではログイン情報が共有されないことがあります。</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const projectUrl='https://slmeqqxjnzmflytzilnt.supabase.co';const publishable='sb_publishable_Km0avobYKA96UOje47efcA_5g0VjpLH';const status=document.getElementById('status'),result=document.getElementById('result'),btn=document.getElementById('run');const set=(s,cls='')=>{status.textContent=s;status.className='status '+cls};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));btn.onclick=async()=>{btn.disabled=true;set('確認中…');result.textContent='';try{if(!window.supabase)throw Error('認証ライブラリを読み込めません。通信環境を確認してください。');const db=window.supabase.createClient(projectUrl,publishable,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const {data:u,error:ue}=await db.auth.getUser();if(ue||!u?.user){set('ログインなし／認証を確認できません','danger');result.textContent='このページではログインが確認できませんでした。ログイン済みの同じドメインで開いてから再試行してください。';return}const {data:links,error:le}=await db.from('dog_account_access').select('dog_id,access_role').eq('user_id',u.user.id);if(le)throw Error('紐づけ取得に失敗しました：'+le.message);set('✅ ログイン確認済み','ok');if(!links?.length){result.innerHTML='<p>このアカウントに承認済みの犬IDはまだありません。</p>';return}const rows=links.map(l=>'<tr><td><code>'+esc(l.dog_id)+'</code></td><td>'+esc(l.access_role)+'</td></tr>').join('');result.innerHTML='<p>承認済みの犬：<strong>'+links.length+'頭</strong></p><table><thead><tr><th>犬ID</th><th>権限</th></tr></thead><tbody>'+rows+'</tbody></table><p class="muted">ここでは犬名やほかのアカウントの情報は取得しません。犬IDだけを今後の編集権限判定に使用します。</p>';}catch(e){set('確認できませんでした','danger');result.textContent=String(e.message||e)}finally{btn.disabled=false}}})();
</script></body></html>
