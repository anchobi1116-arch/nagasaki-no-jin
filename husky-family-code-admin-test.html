<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>長崎の陣｜家族用コード発行・管理者テスト</title><style>body{font-family:system-ui,'Meiryo',sans-serif;background:#f3f5fa;color:#1d283d;margin:0}header{background:#111b2e;color:white;padding:20px}main{max-width:780px;margin:25px auto;padding:0 16px}.panel{background:white;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 1px 6px #0001}input{padding:12px;border:1px solid #bdc6d8;border-radius:9px;font-size:16px;width:100%;box-sizing:border-box}button{padding:12px 16px;border:0;border-radius:10px;background:#172641;color:white;font-weight:bold;cursor:pointer;margin-top:10px}button:disabled{opacity:.5;cursor:wait}.note{background:#fff1d4;padding:14px;border-radius:10px}#dogs{max-height:340px;overflow:auto}.dog{border-bottom:1px solid #edf0f6;padding:10px 0;display:flex;gap:10px;align-items:flex-start}.dog input{width:auto;margin:5px 0}.sub{font-size:13px;color:#50617b}#status{white-space:pre-wrap}.secret{overflow-wrap:anywhere;padding:14px;background:#e7f6e8;border-radius:10px;font-size:18px;font-weight:bold}.hidden{display:none}</style></head><body><header><strong>🐺 長崎の陣｜家族用登録コード発行</strong><div>管理者限定・未公開テスト</div></header><main><p class="note">⚠️ 発行したコードを知っている人は、対象犬の編集権限を取得できます。家族に個別に渡してください。コードをスクショに写したり公開場所に貼ったりしないでね。発行済みコードは再表示できません。</p><section class="panel"><h2>① 管理者ログイン確認</h2><p id="status">確認中...</p></section><section id="controls" class="panel hidden"><h2>② 家族と犬を選ぶ</h2><label>家族の管理用メモ（例：青・夢 家族）<input id="label" maxlength="80" placeholder="家族の名前（管理用）"></label><p><label>犬を検索<input id="search" placeholder="犬の名前・犬舎"></label></p><p class="sub" id="count"></p><div id="dogs"></div><p id="chosen" style="font-weight:bold"></p><h2>③ 登録コードを発行</h2><p class="sub">有効期間：365日。発行後は家族に個別に共有してください。</p><button id="issue" disabled>選んだ犬の家族用コードを発行</button><div id="result" aria-live="polite"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://slmeqqxjnzmflytzilnt.supabase.co';
const SUPABASE_KEY='sb_publishable_Km0avobYKA96UOje47efcA_5g0VjpLH';
const $=id=>document.getElementById(id);let sb,dogs=[],selected=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){let q=$('search').value.trim().toLowerCase(),list=dogs.filter(d=>(d.name+' '+(d.kennel||'')).toLowerCase().includes(q));$('count').textContent=`${list.length}頭表示 / 全${dogs.length}頭`;$('dogs').innerHTML=list.map(d=>`<label class="dog"><input type="checkbox" data-id="${esc(d.id)}" ${selected.has(d.id)?'checked':''}><span><b>${esc(d.name)}</b><br><span class="sub">生年月日: ${esc(d.birth_date||'不明')} / 犬舎: ${esc(d.kennel||'不明')} / ${esc(d.sex||'')}</span></span></label>`).join('');$('chosen').textContent='選択中：'+(dogs.filter(d=>selected.has(d.id)).map(d=>d.name).join('・')||'なし');$('issue').disabled=selected.size===0||!$('label').value.trim()}
$('dogs').addEventListener('change',e=>{if(e.target.matches('[data-id]')){e.target.checked?selected.add(e.target.dataset.id):selected.delete(e.target.dataset.id);draw()}});$('search').addEventListener('input',draw);$('label').addEventListener('input',draw);
async function start(){try{if(!window.supabase)throw Error('接続ライブラリを読み込めません');sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let {data:{user},error}=await sb.auth.getUser();if(error||!user)throw Error('ログインが必要です。先に同じテストサイトでハスキー談話室にログインしてね。');let chk=await sb.rpc('dog_link_admin_pending');if(chk.error)throw chk.error;let out=await sb.rpc('dog_link_directory');if(out.error)throw out.error;dogs=out.data||[];$('status').textContent='✅ 管理者としてログイン中';$('controls').classList.remove('hidden');draw()}catch(e){$('status').textContent='❌ '+e.message}}
$('issue').addEventListener('click',async()=>{let d=dogs.filter(x=>selected.has(x.id));if(!d.length)return;let names=d.map(x=>x.name).join('・');if(!confirm(`「${names}」の家族用登録コードを発行しますか？`))return;let b=$('issue');b.disabled=true;$('result').textContent='発行中...';try{let {data,error}=await sb.rpc('admin_issue_dog_family_code',{p_label:$('label').value.trim(),p_dog_ids:d.map(x=>x.id),p_expiry_days:365});if(error)throw error;let box=document.createElement('div'),p=document.createElement('p'),s=document.createElement('div'),btn=document.createElement('button');p.textContent='✅ 登録コードを発行しました。コードはこの画面に一度だけ表示されます。';s.className='secret';s.textContent=data;btn.textContent='コードをコピー';btn.onclick=()=>{navigator.clipboard.writeText(data).then(()=>{btn.textContent='コピーしました'}).catch(()=>{btn.textContent='コピーできませんでした'})};box.append(p,s,btn);$('result').replaceChildren(box)}catch(e){$('result').textContent='❌ '+e.message}finally{b.disabled=false}});start();
</script></body></html>
