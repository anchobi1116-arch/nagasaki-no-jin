<script>
(()=>{
 const URL="https://slmeqqxjnzmflytzilnt.supabase.co";
 const KEY="sb_publishable_Km0avobYKA96UOje47efcA_5g0VjpLH";
 let sb=null, channel=null;
 const $=id=>document.getElementById(id);
 const status=t=>$("nagasakiCloudStatus").textContent=t;
 const currentEventKey="nagasaki-current-event-id";
 const toggle=$("ngPanelToggle"), body=$("ngPanelBody");
 toggle.onclick=()=>{body.hidden=!body.hidden;toggle.setAttribute("aria-expanded",String(!body.hidden));toggle.textContent=body.hidden?"☁️ 管理者用クラウド接続 ▼":"☁️ 管理者用クラウド接続 ▲"};
 function client(){
   if(sb)return sb;
   if(!window.supabase?.createClient)throw new Error("Supabase SDKを読み込めません");
   sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   return sb;
 }
 async function loadCloudEvents(){
   const sel=$("ngEventSelect"); if(!sel)return [];
   const {data,error}=await client().from("events").select("id,name,short_name,event_date").order("event_date",{ascending:false});
   if(error){sel.innerHTML=`<option value="">イベント取得エラー</option>`;throw error}
   const rows=data||[];
   sel.innerHTML=`<option value="">イベントを選択</option>`+rows.map(ev=>`<option value="${ev.id}">${(ev.name||ev.short_name||"イベント").replace(/</g,"&lt;")}</option>`).join("");
   const saved=localStorage.getItem(currentEventKey);
   if(saved&&rows.some(x=>String(x.id)===String(saved)))sel.value=saved;
   if(!saved){
     let localName="";
     try{const lev=(typeof e==="function"?e():null);localName=String(lev?.name||lev?.shortName||"").trim()}catch(_){}
     const norm=x=>String(x||"").replace(/[\s'’・]/g,"").toLowerCase();
     let match=rows.find(x=>norm(x.name||x.short_name)===norm(localName));
     if(!match&&rows.length===1)match=rows[0];
     if(match){localStorage.setItem(currentEventKey,match.id);sel.value=match.id;await subscribe(match.id)}
   }
   return rows;
 }
 async function refresh(){
   try{
    const {data:{session}}=await client().auth.getSession();
    $("ngLoggedOut").hidden=!!session; $("ngLoggedIn").hidden=!session;
    $("ngUser").textContent=session?`ログイン中: ${session.user.email}`:"";
    if(session)await loadCloudEvents();
    const ceid=localStorage.getItem(currentEventKey);
    const sel=$("ngEventSelect"), label=ceid&&sel?.selectedOptions?.[0]?.textContent;
    $("ngEventInfo").textContent=ceid?`接続中: ${label||ceid}`:"イベント未選択";
    status(session?(ceid?"Supabase接続済み・イベント接続済み":"Supabase接続済み・イベントを選択してください"):"ログインしてください");
   }catch(e){status("接続エラー: "+e.message)}
 }
 async function subscribe(eid){
   if(channel)await client().removeChannel(channel);
   channel=client().channel("receptions:"+eid)
    .on("postgres_changes",{event:"*",schema:"public",table:"receptions",filter:`event_id=eq.${eid}`},p=>{
      window.dispatchEvent(new CustomEvent("nagasaki:cloud-reception-change",{detail:p}));
      status("同期受信: "+new Date().toLocaleTimeString());
    }).subscribe();
 }

 $("ngSignup").onclick=async()=>{
   const email=$("ngEmail").value.trim(), password=$("ngPassword").value;
   if(!email){status("メールアドレスを入力してください");return}
   if(password.length<8){status("パスワードは8文字以上で設定してください");return}
   status("アカウント登録中…");
   let data,error;try{({data,error}=await client().auth.signUp({email,password}))}catch(e){status("登録失敗: "+e.message);return}
   if(error){status("登録失敗: "+error.message);return}
   if(data?.session){
     status("登録・ログイン完了。イベントを作成できます");
     await refresh();
   }else{
     status("登録受付完了。確認メールが届いた場合は、メール内の確認を済ませてからログインしてください");
   }
 };
 $("ngLogin").onclick=async()=>{
   status("ログイン中…");
   let error;try{({error}=await client().auth.signInWithPassword({email:$("ngEmail").value.trim(),password:$("ngPassword").value}))}catch(e){status("ログイン失敗: "+e.message);return}
   if(error){status("ログイン失敗: "+error.message);return}
   await refresh();
 };
 $("ngLogout").onclick=async()=>{await client().auth.signOut();localStorage.removeItem(currentEventKey);await refresh()};
 $("ngUseEvent").onclick=async()=>{
   const ceid=$("ngEventSelect").value;if(!ceid){status("イベントを選択してください");return}
   localStorage.setItem(currentEventKey,ceid);await subscribe(ceid);await refresh();status("イベントに接続しました");
 };
 $("ngCreateEvent").onclick=async()=>{
   const name=$("ngEventName").value.trim();
   if(!name){status("イベント名を入力してください");return}
   status("イベント作成中…");
   const {data,error}=await client().rpc("create_event_with_owner",{p_name:name,p_event_date:null});
   if(error){status("イベント作成失敗: "+error.message);return}
   const ev=Array.isArray(data)?data[0]:data;
   if(ev?.id){localStorage.setItem(currentEventKey,ev.id);await subscribe(ev.id)}
   await refresh(); status("イベントを作成しました");
 };
 client().auth.onAuthStateChange(()=>setTimeout(refresh,0));
 setTimeout(async()=>{await refresh();const eid=localStorage.getItem(currentEventKey);if(eid)await subscribe(eid)},1200);
 window.NagasakiCloud={
   client,
   currentEventId:()=>localStorage.getItem(currentEventKey),
   async listReceptions(){const eid=this.currentEventId();if(!eid)throw new Error("イベント未選択");const {data,error}=await client().from("receptions").select("*").eq("event_id",eid).order("updated_at",{ascending:false});if(error)throw error;return data},
   async saveReception(row){const eid=this.currentEventId();if(!eid)throw new Error("イベント未選択");const {data,error}=await client().from("receptions").upsert({...row,event_id:eid,updated_at:new Date().toISOString()}).select().single();if(error)throw error;return data}
 };
})();
</script>
