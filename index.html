function getCurrentEventRecord(){

   if(!db||!Array.isArray(db.events)||typeof eid==="undefined")return null;

 }catch(_){return null}

function eventSyncMeta(){
 const ev=getCurrentEventRecord();
 const dateText=String(ev?.date||ev?.eventDate||"").trim();
 let isPast=false,isFuture=false;
 if(dateText){
   const start=new Date(dateText+"T00:00:00");
   const end=new Date(dateText+"T23:59:59");
   if(Number.isFinite(end.getTime()))isPast=end.getTime()<Date.now();
   if(Number.isFinite(start.getTime()))isFuture=start.getTime()>Date.now();
 }

}

     try{mirror=JSON.parse(mirrorRaw||"[]")}catch(_){mirror=[]}
     if(Array.isArray(mirror)&&mirror.length){
       localStorage.setItem(primaryKey,JSON.stringify(mirror));
       localStorage.setItem(this.queueChecksumKey(),this.checksum(JSON.stringify(mirror)));
       SyncAudit.add("queue-integrity-recovered",{count:mirror.length,primaryValid:valid});
       return mirror;
     }
     if(!valid)SyncAudit.add("queue-integrity-failed",{mirrorAvailable:false});
     return [];
   }catch(_){return []}
 },
 setQueue(q){
   try{
     const seen=new Set(),unique=[];
     for(let i=q.length-1;i>=0;i--){
       const item=q[i];
       const id=item?.changeId||`${item?.deviceId||this.deviceId}|${item?.eventId||"global"}|${item?.revision||i}`;
       if(seen.has(id))continue;
       seen.add(id);unique.push(item);
     }
     unique.reverse();
     const saved=unique.slice(-100);
     const encoded=JSON.stringify(saved);
     localStorage.setItem(this.scopedKey(this.queueKey),encoded);
     localStorage.setItem(this.queueMirrorKey(),encoded);
     localStorage.setItem(this.queueChecksumKey(),this.checksum(encoded));
   }catch(_){}
 },
 enqueue(change){
   let q=this.getQueue();
   if(change?.changeId&&q.some(x=>x?.changeId===change.changeId)){
     SyncAudit.add("queue-duplicate-skipped",{changeId:change.changeId,count:q.length});
     window.dispatchEvent(new CustomEvent("nagasaki:sync-queued",{detail:{count:q.length}}));return;
   }
   const key=`${change?.deviceId||this.deviceId}|${change?.eventId||"global"}`;
   q=q.filter(x=>`${x?.deviceId||this.deviceId}|${x?.eventId||"global"}`!==key || Number(x?.revision||0)>Number(change?.revision||0));
   const newer=q.some(x=>`${x?.deviceId||this.deviceId}|${x?.eventId||"global"}`===key && Number(x?.revision||0)>=Number(change?.revision||0));
   if(!newer)q.push(change);
   q.sort((a,b)=>Number(a?.revision||0)-Number(b?.revision||0));
   this.setQueue(q);
   window.dispatchEvent(new CustomEvent("nagasaki:sync-queued",{detail:{count:q.length}}));
 },
 async flushQueue(){
   if(!this.enabled||!this.endpoint||!navigator.onLine)return {status:"local"};
   const scope=this.operationScope();
   const q=this.getQueue();
   if(!q.length)return {status:"empty",sent:0,remaining:0};
   let sent=0;
   while(q.length){
     if(!this.scopeStillCurrent(scope)){
       this.setQueue(q);
       SyncAudit.add("queue-flush-paused",{reason:"scope-changed",sent,remaining:q.length});
       return {status:"scope-changed",sent,remaining:q.length};
     }
     const item=q[0];
     try{
       const result=await this.push(item,true);
       if(!result||result.status==="timeout"||result.status==="scope-changed"||result.status==="error"||result.status==="conflict"){
         this.setQueue(q);
         SyncAudit.add("queue-flush-paused",{reason:result?.status||"unknown",sent,remaining:q.length});
         return {status:result?.status||"paused",sent,remaining:q.length};
       }
       q.shift(); sent++;
       this.setQueue(q);
     }catch(err){
       this.setQueue(q);
       this.noteNetworkFailure();
       SyncAudit.add("queue-flush-error",{message:String(err),sent,remaining:q.length});
       return {status:"error",sent,remaining:q.length};
     }
   }
   SyncAudit.add("queue-flushed",{sent,remaining:0});
   window.dispatchEvent(new CustomEvent("nagasaki:queue-flushed",{detail:{sent,remaining:0}}));
   return {status:"ok",sent,remaining:0};
 },
 init(){
   if(!this.deviceId){
     this.deviceId="dev-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
     localStorage.setItem("nagasaki-device-id",this.deviceId);
   }
   try{
     const cfg=JSON.parse(localStorage.getItem("nagasaki-sync-config")||"{}");
     this.endpoint=String(cfg.endpoint||"");this.authToken=String(cfg.authToken||"");this.authMode=String(cfg.authMode||"bearer");this.enabled=!!(cfg.enabled&&this.endpoint);
   }catch(_){}
 },
 headers(extra={}){
   const h={"Accept":"application/json",...extra};
   if(this.authMode==="bearer"&&this.authToken)h["Authorization"]="Bearer "+this.authToken;
   return h;
 },
 async handshake(){
   return this.once("handshake",()=>this._handshake());
 },
 async pull(){
   return this.once("pull",()=>this._pull());
 },
 async _handshake(){
   if(!this.enabled||!this.endpoint||!navigator.onLine)return {status:"local"};
   try{
     const u=this.endpoint+(this.endpoint.includes("?")?"&":"?")+"type=handshake&protocolVersion=1&schemaVersion="+encodeURIComponent(db?.schemaVersion||169)+"&eventId="+encodeURIComponent(eventSyncMeta().eventId||"")+"&eventPast="+encodeURIComponent(eventSyncMeta().isPast?"1":"0")+"&eventFuture="+encodeURIComponent(eventSyncMeta().isFuture?"1":"0")+"&eventLifecycle="+encodeURIComponent(eventSyncMeta().lifecycle)+"&eventArchived="+encodeURIComponent(eventSyncMeta().archived?"1":"0")+"&sessionId="+encodeURIComponent(this.sessionId);
     const timed=await this.withTimeout("handshake",signal=>fetch(u,{method:"GET",headers:this.headers(),signal}));
     if(timed?.status==="timeout")return timed;
     const res=timed;
     if(res.status===401||res.status===403){
       window.dispatchEvent(new CustomEvent("nagasaki:sync-auth-error"));
       return {status:"auth-error"};
     }
     if(!res.ok)throw new Error("HTTP "+res.status);
     const payload=await res.json();
     if(payload?.serverTime){
       const serverMs=Date.parse(payload.serverTime),localMs=Date.now();
       if(Number.isFinite(serverMs)){
         const skewMs=localMs-serverMs;
         localStorage.setItem("nagasaki-server-clock-skew-ms",String(skewMs));
         if(Math.abs(skewMs)>120000){
           window.dispatchEvent(new CustomEvent("nagasaki:clock-skew",{detail:{skewMs}}));
         }else{
           window.dispatchEvent(new CustomEvent("nagasaki:clock-ok",{detail:{skewMs}}));
         }
       }
     }
     const protocolOk=Number(payload?.protocolVersion||0)===1;
     const schemaMin=Number(payload?.minSchemaVersion||0);
     const schemaMax=Number(payload?.maxSchemaVersion||999999);
     const schemaNow=Number(db?.schemaVersion||154);
     if(!protocolOk||schemaNow<schemaMin||schemaNow>schemaMax){
       window.dispatchEvent(new CustomEvent("nagasaki:sync-incompatible",{detail:{protocolOk,schemaNow,schemaMin,schemaMax}}));
       return {status:"incompatible"};
     }
     localStorage.setItem("nagasaki-sync-handshake",JSON.stringify({at:new Date().toISOString(),protocolVersion:1,schemaVersion:schemaNow}));
     window.dispatchEvent(new CustomEvent("nagasaki:sync-compatible"));
     return {status:"ok"};
   }catch(err){
     window.dispatchEvent(new CustomEvent("nagasaki:sync-error",{detail:{message:String(err)}}));
     return {status:"error"};
   }
 },
 async _pull(){
   if(!this.enabled||!this.endpoint||!navigator.onLine)return {status:"local"};
   const requestScope=this.operationScope();
   try{
     const u=this.endpoint+(this.endpoint.includes("?")?"&":"?")+"type=pull&deviceId="+encodeURIComponent(this.deviceId)+"&knownRevision="+encodeURIComponent(this.remoteRevision||"")+"&eventId="+encodeURIComponent((typeof eid!=="undefined"&&eid!=null)?String(eid):"");
     const timed=await this.withTimeout("pull",signal=>fetch(u,{method:"GET",headers:this.headers(),signal}));
     if(timed?.status==="timeout")return timed;
     const res=timed;
     if(res.status===304){
       localStorage.setItem("nagasaki-last-sync-check",new Date().toISOString());
       window.dispatchEvent(new CustomEvent("nagasaki:sync-no-change"));
       return {status:"synced",updated:false};
     }
     if(res.status===401||res.status===403){window.dispatchEvent(new CustomEvent("nagasaki:sync-auth-error"));return {status:"auth-error"};}
     if(!res.ok)throw new Error("HTTP "+res.status);
     const payload=await res.json();
     if(!this.scopeStillCurrent(requestScope)){
       SyncAudit.add("stale-event-response-rejected",{requestScope,currentScope:this.operationScope()});
       return {status:"scope-changed",updated:false};
     }
     const compatibility=NagasakiCompatibility.checkRemote(payload);
     if(!compatibility.ok)return {status:"schema-incompatible",updated:false,remoteSchema:compatibility.remote};
     if(payload?.revision!=null){
       this.remoteRevision=String(payload.revision);
       localStorage.setItem(this.scopedKey("nagasaki-remote-revision"),this.remoteRevision);
     }
     if(payload&&payload.data&&typeof payload.data==="object"){
       const incoming=payload.data;
       const localEventId=(typeof eid!=="undefined"&&eid!=null)?String(eid):"";
       const remoteEventId=payload.eventId!=null?String(payload.eventId):"";
       if(localEventId&&remoteEventId&&localEventId!==remoteEventId){
         SyncAudit.add("remote-data-rejected",{reason:"event-mismatch",localEventId,remoteEventId});
         window.dispatchEvent(new CustomEvent("nagasaki:event-mismatch",{detail:{localEventId,remoteEventId}}));
         return {status:"event-mismatch",updated:false};
       }
       try{
         const snapshotKey=this.scopedKey("nagasaki-sync-snapshots");
         const snapshots=JSON.parse(localStorage.getItem(snapshotKey)||"[]");
         snapshots.push({
           at:new Date().toISOString(),
           reason:"before-remote-apply",
           eventId:(typeof eid!=="undefined"&&eid!=null)?String(eid):"global",
           data:JSON.parse(JSON.stringify(db))
         });
         localStorage.setItem(snapshotKey,JSON.stringify(snapshots.slice(-3)));
       }catch(_){}
       const serverRevision=Number(payload.revision||0);
       const localRevision=Number(localStorage.getItem(this.scopedKey("nagasaki-local-revision"))||0);
       const lastSynced=Number(localStorage.getItem(this.scopedKey("nagasaki-last-synced-revision"))||0);
       if(serverRevision&&serverRevision<lastSynced){
         window.dispatchEvent(new CustomEvent("nagasaki:sync-stale",{detail:{serverRevision,lastSynced}}));
         return {status:"stale",updated:false};
       }
       if(Array.isArray(incoming) || Object.keys(incoming).length===0){
         SyncAudit.add("remote-data-rejected",{reason:"invalid-shape"});
         window.dispatchEvent(new CustomEvent("nagasaki:remote-data-rejected"));
         return {status:"invalid",updated:false};
       }
       // Apply valid shared data. Revision metadata remains device-local.
       Object.keys(db).forEach(k=>delete db[k]);
       Object.assign(db,incoming);
       if(serverRevision){
         localStorage.setItem(this.scopedKey("nagasaki-last-synced-revision"),String(serverRevision));
         localStorage.setItem(this.scopedKey("nagasaki-local-revision"),String(Math.max(localRevision,serverRevision)));
       }
       try{localStorage.setItem("db",JSON.stringify(db))}catch(_){}
       localStorage.setItem(this.scopedKey("nagasaki-last-sync"),new Date().toISOString());
       localStorage.setItem(this.scopedKey("nagasaki-last-remote-update"),new Date().toISOString());
       window.dispatchEvent(new CustomEvent("nagasaki:remote-data",{detail:{at:new Date().toISOString()}}));
       window.dispatchEvent(new CustomEvent("nagasaki:sync-ok"));
       return {status:"synced",updated:true};
     }
     return {status:"synced",updated:false};
   }catch(err){
     window.dispatchEvent(new CustomEvent("nagasaki:sync-error",{detail:{message:String(err)}}));
     return {status:"error"};
   }
 },
 async push(change,fromQueue=false){
   if(!this.enabled||!this.endpoint)return {status:"local"};
   if(!navigator.onLine){if(!fromQueue)this.enqueue(change);this.scheduleRetry();return {status:"queued"};}
   try{
     const timed=await this.withTimeout("push",signal=>fetch(this.endpoint,{method:"POST",headers:this.headers({"Content-Type":"application/json"}),
       body:JSON.stringify({protocolVersion:1,type:"push",deviceId:this.deviceId,sessionId:this.sessionId,eventId:change?.eventId??((typeof eid!=="undefined")?eid:null),eventMeta:eventSyncMeta(),changeId:change?.changeId||null,change,data:db})}));
     if(timed?.status==="timeout")return timed;
     const res=timed;
     if(res.status===401||res.status===403){window.dispatchEvent(new CustomEvent("nagasaki:sync-auth-error"));return {status:"auth-error"};}
     if(res.status===409||res.status===412){
       this.markDirty("server-conflict");
       SyncAudit.add("server-conflict-detected",{status:res.status,changeId:change?.changeId||null,scope:this.operationScope()});
       window.dispatchEvent(new CustomEvent("nagasaki:sync-conflict",{detail:{status:res.status,changeId:change?.changeId||null}}));
       return {status:"conflict",httpStatus:res.status};
     }
     if(!res.ok)throw new Error("HTTP "+res.status);
     if(!this.scopeStillCurrent(requestScope)){
       SyncAudit.add("stale-event-push-response",{requestScope,currentScope:this.operationScope()});
       return {status:"scope-changed"};
     }
     localStorage.setItem(this.scopedKey("nagasaki-last-sync"),new Date().toISOString());
     if(change?.revision!=null)localStorage.setItem(this.scopedKey("nagasaki-last-synced-revision"),String(change.revision));
     window.dispatchEvent(new CustomEvent("nagasaki:sync-ok"));
     return {status:"synced"};
   }catch(err){
     if(!fromQueue)this.enqueue(change);
     this.scheduleRetry();
     window.dispatchEvent(new CustomEvent("nagasaki:sync-error",{detail:{message:String(err)}}));
     return {status:"error"};
   }
 }

function emitLocalSyncChange(){

   const revKey=NagasakiSync.scopedKey("nagasaki-local-revision");
   const revision=Number(localStorage.getItem(revKey)||0)+1;
   localStorage.setItem(revKey,String(revision));
   const deviceId=NagasakiSync?.deviceId||null;
   const changeId=`${deviceId||"device"}-${revision}`;
   const detail={changeId,at:syncNowIso(),revision,deviceId,eventId:typeof eid!=="undefined"?eid:null,schemaVersion:db?.schemaVersion||155};
   SyncAudit.add("local-change",{changeId:detail.changeId,revision:detail.revision,eventId:detail.eventId});
   window.dispatchEvent(new CustomEvent("nagasaki:data-changed",{detail}));
   localStorage.setItem("nagasaki-last-change",JSON.stringify(detail));
 }catch(_){}
}

function ensureUniqueEventIds(){
 try{
   if(!db||!Array.isArray(db.events))return;
   const used=new Set();
   let changed=false;
   db.events.forEach((ev,i)=>{
     let id=String(ev?.id??"").trim();
     if(!id || used.has(id)){
       const base=(id||`event-${i+1}`).replace(/[^a-zA-Z0-9_-]/g,"_");
       let n=1,next=base;
       while(used.has(next))next=`${base}-${++n}`;
       ev.id=next; id=next; changed=true;
       SyncAudit.add("event-id-repaired",{index:i,eventId:id});
     }
     used.add(id);
   });
   if(changed)try{localStorage.setItem("nagasaki-last-event-id-repair",new Date().toISOString())}catch(_){}
 }catch(_){}
}

function dogProfileCompletion(d){
 if(!d)return {percent:0,missing:["犬プロフィール"]};
 const fields=[
  ["name","犬名"],["prefecture","都道府県"],["breed","犬種"],["sex","性別"],
  ["birthday","誕生日"],["photo","写真"]
 ];
 const applicable=fields.filter(([k])=>k in d || ["name","prefecture"].includes(k));
 const missing=applicable.filter(([k])=>!String(d[k]??"").trim()).map(([,label])=>label);
 const done=applicable.length-missing.length;
 return {percent:applicable.length?Math.round(done/applicable.length*100):100,missing};
}

function cloudStorageReady(){return !!initCloudClient()}
async function uploadCloudFile(bucket,path,file){
 const s=initCloudClient();if(!s)throw new Error("Supabase接続が未設定です");
 const {error}=await s.storage.from(bucket).upload(path,file,{upsert:true,contentType:file.type||undefined});
 if(error)throw error;
 const {data}=s.storage.from(bucket).getPublicUrl(path);
 return {path,url:data.publicUrl};
}
function safeFileName(name){return (name||"file").replace(/[^a-zA-Z0-9._-]/g,"_")}
async function uploadDogPhotoCloud(d,file){
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
 const dogKey=isUUID(d.id)?d.id:("local-"+Date.now());
 const path=`dogs/${dogKey}/profile-${Date.now()}.${ext}`;
 const r=await uploadCloudFile("dog-photos",path,file);
 d.photo=r.url;d.photoPath=r.path;save();return r;
}
async function uploadEventMediaCloud(ev,file,uploader){
 const ext=(file.name.split(".").pop()||"bin").toLowerCase();
 const eventKey=isUUID(ev.id)?ev.id:("local-"+Date.now());
 const path=`events/${eventKey}/${Date.now()}-${safeFileName(file.name)}`;
 const r=await uploadCloudFile("event-media",path,file);
 const s=initCloudClient();
 if(isUUID(ev.id)){
   const {data:{user}}=await s.auth.getUser();
   const ins=await s.from("media").insert({event_id:ev.id,uploader_id:user?.id||null,media_type:file.type.startsWith("video/")?"video":"image",storage_path:r.path}).select("id").single();
   if(ins.error)throw ins.error;
 }
 ev.gallery=ev.gallery||[];
 ev.gallery.push({src:r.url,storagePath:r.path,type:file.type.startsWith("video/")?"video":"image",uploader:uploader||"参加者",createdAt:new Date().toISOString(),likes:0,comments:[]});
 save();return r;
}


async function deleteCloudStorageObject(bucket,path){
 if(!path)return;
 const s=initCloudClient();if(!s)return;
 const {error}=await s.storage.from(bucket).remove([path]);
 if(error)throw error;
}
function dataUrlToFile(dataUrl,name){
 const [head,body]=dataUrl.split(","),mime=(head.match(/data:(.*?);/)||[])[1]||"application/octet-stream";
 const bin=atob(body),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
 return new File([arr],name,{type:mime});
}
async function migrateLegacyMediaToCloud(){
 const s=initCloudClient();if(!s)throw new Error("Supabase接続が未設定です");
 let dogDone=0,mediaDone=0,failed=0;
 for(const d of db.dogs){
   if((d.photo||"").startsWith("data:")){
     try{const f=dataUrlToFile(d.photo,`dog-${d.id}.jpg`);await uploadDogPhotoCloud(d,f);dogDone++}catch(e){failed++}
   }
 }
 for(const ev of db.events){
   for(const g of (ev.gallery||[])){
     if((g.src||"").startsWith("data:")){
       try{
         const ext=g.type==="video"?"mp4":"jpg",f=dataUrlToFile(g.src,`media-${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`);
         const r=await uploadCloudFile("event-media",`events/${isUUID(ev.id)?ev.id:"local-"+ev.id}/${Date.now()}-${safeFileName(f.name)}`,f);
         g.src=r.url;g.storagePath=r.path;mediaDone++;
       }catch(e){failed++}
     }
   }
 }
 save();return {dogDone,mediaDone,failed};
}

let cloudDbSyncing=false,cloudDbSaveTimer=null;
async function cloudDbPull(){
 const s=initCloudClient();if(!s)throw new Error("Supabase接続が未設定です");
 const {data,error}=await s.from("app_state").select("data,updated_at").eq("id","main").maybeSingle();
 if(error)throw error;
 if(data?.data){
   const localCloud=db.cloudConfig;
   db=data.data;
   db.cloudConfig=localCloud||db.cloudConfig;
   localStorage.setItem("husrock_db",JSON.stringify(db));
   return {found:true,updatedAt:data.updated_at};
 }
 return {found:false};
}
async function cloudDbPush(){
 const s=initCloudClient();if(!s)throw new Error("Supabase接続が未設定です");
 const payload=JSON.parse(JSON.stringify(db));
 const {error}=await s.from("app_state").upsert({id:"main",data:payload,updated_at:new Date().toISOString()},{onConflict:"id"});
 if(error)throw error;
 return true;
}
function scheduleCloudDbPush(){
 if(!db.cloudConfig?.connected||cloudDbSyncing)return;
 clearTimeout(cloudDbSaveTimer);
 cloudDbSaveTimer=setTimeout(()=>cloudDbPush().catch(err=>console.warn("cloud sync:",err)),700);
}
async function cloudDbInitialSync(){
 if(!db.cloudConfig?.connected)return;
 try{
   cloudDbSyncing=true;
   const r=await cloudDbPull();
   if(!r.found)await cloudDbPush();
 }catch(e){console.warn("initial cloud sync:",e)}
 finally{cloudDbSyncing=false}
}






function broadcastParticipantNotification(title,message){
 (db.participantAccounts||[]).forEach(a=>addParticipantNotification(a.id,title,message,"broadcast"));
}
function scheduleParticipantNotice(title,message,sendAt){
 db.scheduledParticipantNotices=db.scheduledParticipantNotices||[];
 db.scheduledParticipantNotices.push({id:"spn-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),title,message,sendAt,status:"scheduled",createdAt:new Date().toISOString()});save();
}
function processScheduledParticipantNotices(){
 const now=Date.now();let changed=false;
 (db.scheduledParticipantNotices||[]).forEach(n=>{
   if(n.status==="scheduled"&&new Date(n.sendAt).getTime()<=now){
     (db.participantAccounts||[]).forEach(a=>{
       db.participantNotifications.unshift({id:"pn-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),accountId:a.id,title:n.title,message:n.message,type:"broadcast",read:false,createdAt:new Date().toISOString()})
     });
     n.status="sent";n.sentAt=new Date().toISOString();changed=true;
   }
 });
 if(changed)save();
}

function addParticipantNotification(accountId,title,message,type="info"){
 db.participantNotifications=db.participantNotifications||[];
 db.participantNotifications.unshift({id:"pn-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),accountId,title,message,type,read:false,createdAt:new Date().toISOString()});
 save();
}
function participantNotifications(accountId){
 return (db.participantNotifications||[]).filter(n=>String(n.accountId)===String(accountId)).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
}
function unreadParticipantNotifications(accountId){return participantNotifications(accountId).filter(n=>!n.read).length}

function requestDogLink(accountId,dogId){
 const a=db.participantAccounts.find(x=>String(x.id)===String(accountId)),d=db.dogs.find(x=>String(x.id)===String(dogId));
 if(!a||!d)throw new Error("アカウントまたは犬が見つかりません");
 if(d.ownerAccountId)throw new Error("この犬はすでに参加者アカウントと紐付いています");
 if(db.dogLinkRequests.some(r=>r.status==="pending"&&String(r.accountId)===String(a.id)&&String(r.dogId)===String(d.id)))throw new Error("この犬はすでに申請中です");
 db.dogLinkRequests.push({id:"dlr-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),accountId:a.id,dogId:d.id,status:"pending",createdAt:new Date().toISOString()});save();
}
function pendingDogLinkRequests(){return (db.dogLinkRequests||[]).filter(r=>r.status==="pending")}
function decideDogLinkRequest(id,approve){
 const r=db.dogLinkRequests.find(x=>String(x.id)===String(id));if(!r)return;
 const dog=db.dogs.find(d=>String(d.id)===String(r.dogId));
 if(approve){assignDogToAccount(r.dogId,r.accountId);r.status="approved";addParticipantNotification(r.accountId,"犬プロフィールの紐付けが承認されました",(dog?.name||"犬")+" のプロフィールを編集できるようになりました。","approved")}else{r.status="rejected";addParticipantNotification(r.accountId,"犬プロフィールの紐付け申請について",(dog?.name||"犬")+" の申請は承認されませんでした。必要な場合は管理者へ確認してください。","rejected")}
 r.decidedAt=new Date().toISOString();save();
}

function dogOwnerAccount(dog){
 if(!dog?.ownerAccountId)return null;

}
function canParticipantEditDog(dog){

function assignDogToAccount(dogId,accountId){
 const d=db.dogs.find(x=>String(x.id)===String(dogId)),a=db.participantAccounts.find(x=>String(x.id)===String(accountId));
 if(!d||!a)return false;
 (db.participantAccounts||[]).forEach(x=>x.dogIds=(x.dogIds||[]).filter(id=>String(id)!==String(dogId)));
 d.ownerAccountId=a.id;a.dogIds=a.dogIds||[];if(!a.dogIds.map(String).includes(String(d.id)))a.dogIds.push(d.id);save();return true;
}
function unassignDogOwner(dogId){

 (db.participantAccounts||[]).forEach(a=>a.dogIds=(a.dogIds||[]).filter(id=>String(id)!==String(dogId)));
 d.ownerAccountId="";save();
}

function normalizeAccountName(v){return (v||"").trim().toLowerCase()}
function participantAccountByName(name){const n=normalizeAccountName(name);return (db.participantAccounts||[]).find(a=>normalizeAccountName(a.accountName)===n)}
function currentParticipantAccount(){
 const id=localStorage.getItem("nagasaki_participant_account_id");
 return (db.participantAccounts||[]).find(a=>String(a.id)===String(id))||null;
}

function makeRecoveryCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function accountNameAvailable(name){
 const n=normalizeAccountName(name);return n.length>=2&&!participantAccountByName(n);
}
function recoverParticipantAccount(accountName,recoveryCode){
 const a=participantAccountByName(accountName);
 if(!a)throw new Error("アカウント名が見つかりません");
 if(!a.recoveryCode||String(a.recoveryCode).toUpperCase()!==String(recoveryCode||"").trim().toUpperCase())throw new Error("引き継ぎコードが違います");
 a.deviceToken=makeDeviceToken();
 localStorage.setItem("nagasaki_participant_account_id",a.id);
 localStorage.setItem("nagasaki_participant_device_token",a.deviceToken);
 save();return a;
}

function makeDeviceToken(){return (crypto?.randomUUID?.()||("dev-"+Date.now()+"-"+Math.random().toString(36).slice(2)))}
function registerParticipantAccount(accountName){
 const clean=(accountName||"").trim();
 if(clean.length<2)throw new Error("アカウント名は2文字以上で入力してください");
 if(participantAccountByName(clean))throw new Error("このアカウント名はすでに使用されています。別の名前を入力してください。");
 const a={id:"pa-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),accountName:clean,deviceToken:makeDeviceToken(),recoveryCode:makeRecoveryCode(),createdAt:new Date().toISOString(),dogIds:[]};
 db.participantAccounts.push(a);localStorage.setItem("nagasaki_participant_account_id",a.id);localStorage.setItem("nagasaki_participant_device_token",a.deviceToken);save();return a;
}
function participantAutoLogin(){
 const a=currentParticipantAccount(),token=localStorage.getItem("nagasaki_participant_device_token");
 return a&&token&&a.deviceToken===token?a:null;
}

 <div class="card"><h3>👥 参加者アカウント状況</h3><div class="myAccountGrid"><div class="myAccountStat"><strong>${(db.participantAccounts||[]).length}</strong>アカウント</div><div class="myAccountStat"><strong>${db.dogs.filter(d=>d.ownerAccountId).length}</strong>紐付け済み犬</div><div class="myAccountStat"><strong>${pendingDogLinkRequests().length}</strong>承認待ち</div></div></div>
 <div class="card"><h3>📢 参加者全員へお知らせ</h3><div class="broadcastBox"><input id="broadcastTitle" placeholder="タイトル"><textarea id="broadcastMessage" placeholder="参加者全員へのお知らせ内容"></textarea><label>送信日時（空欄なら今すぐ）</label><input id="broadcastSendAt" type="datetime-local"><div class="actions"><button class="btn primary" id="sendBroadcastNow">今すぐ全員へ送信</button><button class="btn soft" id="scheduleBroadcast">日時指定で予約</button></div><div id="broadcastResult"></div></div>${(db.scheduledParticipantNotices||[]).length?`<h4>予約・送信履歴</h4>${(db.scheduledParticipantNotices||[]).slice().reverse().slice(0,8).map(n=>`<div class="broadcastHistory"><b>${esc(n.title)}</b> <span class="scheduleTag">${n.status==="sent"?"送信済み":"予約中"}</span><div class="muted">${esc(n.status==="sent"?(n.sentAt||""):(n.sendAt||""))}</div></div>`).join("")}`:""}</div>
 <div class="card"><h3>📣 参加者へ個別お知らせ</h3><p class="muted">参加者のマイページに個別のお知らせを表示できます。</p><select id="notifyParticipantAccount"><option value="">参加者を選択</option>${(db.participantAccounts||[]).map(a=>`<option value="${esc(a.id)}">${esc(a.accountName)}</option>`).join("")}</select><input id="notifyParticipantTitle" placeholder="タイトル"><textarea id="notifyParticipantMessage" placeholder="お知らせ内容"></textarea><button class="btn primary" id="sendParticipantNotification">送信</button><div id="notifyParticipantResult"></div></div>

 <div class="card"><h3>🔔 犬プロフィール紐付け申請</h3>${pendingDogLinkRequests().length?pendingDogLinkRequests().map(r=>{const a=db.participantAccounts.find(x=>String(x.id)===String(r.accountId)),d=db.dogs.find(x=>String(x.id)===String(r.dogId));return `<div class="requestRow"><b>${esc(a?.accountName||"不明")}</b> → 🐺 ${esc(d?.name||"不明")} <span class="requestBadge">申請中</span><div class="requestActions"><button class="btn primary approveDogRequest" data-id="${esc(r.id)}">承認</button><button class="btn soft rejectDogRequest" data-id="${esc(r.id)}">却下</button></div></div>`}).join(""):"<p class='muted'>現在、承認待ちの申請はありません。</p>"}</div>

 <div class="card"><h3>権限の考え方</h3><div class="authUserRow"><div><b>参加者</b><div class="muted">アカウント名＋登録端末。パスワードなし。自分の犬プロフィール・写真投稿など</div></div><span class="roleBadge">participant</span></div><div class="authUserRow"><div><b>管理者</b><div class="muted">参加名簿、イベント設定、全プロフィール管理</div></div><span class="roleBadge">admin</span></div><p class="muted">次の段階でSupabase RLSとユーザーIDを結び、サーバー側でもこの権限を強制します。</p></div>
 <div class="card"><button class="btn soft" id="authCloudDb">🗄️ 共有データベース</button><button class="btn soft" id="authBack">主催者画面へ戻る</button></div>`;
 document.getElementById("saveAuthConfig").onclick=()=>{db.authConfig.enabled=document.getElementById("authEnabled").checked;save();alert("認証設定を保存しました")};
 const result=t=>document.getElementById("authResult").textContent=t;
 document.getElementById("authLogin").onclick=async()=>{try{const u=await cloudSignIn(document.getElementById("authEmail").value.trim(),document.getElementById("authPassword").value);result("✅ ログイン: "+(u.email||u.id)+" / "+cloudRoleFor(u))}catch(e){result("❌ "+e.message)}};
 document.getElementById("authSignup").onclick=async()=>{try{const u=await cloudSignUp(document.getElementById("authEmail").value.trim(),document.getElementById("authPassword").value);result("✅ 登録しました。メール確認設定によっては確認メールが届きます。 "+(u?.email||""))}catch(e){result("❌ "+e.message)}};
 document.getElementById("authLogout").onclick=async()=>{await cloudSignOut();result("ログアウトしました")};
 document.querySelectorAll(".approveDogRequest").forEach(b=>b.onclick=()=>{if(confirm("この犬との紐付けを承認しますか？")){decideDogLinkRequest(b.dataset.id,true);authManagementPage()}});
 document.querySelectorAll(".rejectDogRequest").forEach(b=>b.onclick=()=>{if(confirm("この申請を却下しますか？")){decideDogLinkRequest(b.dataset.id,false);authManagementPage()}});
 document.querySelectorAll(".dogOwnerSelect").forEach(s=>s.onchange=()=>{if(s.value)assignDogToAccount(s.dataset.id,s.value);else unassignDogOwner(s.dataset.id);authManagementPage()});
 let sendBroadcastNow=document.getElementById("sendBroadcastNow");if(sendBroadcastNow)sendBroadcastNow.onclick=()=>{const t=document.getElementById("broadcastTitle").value.trim(),m=document.getElementById("broadcastMessage").value.trim(),box=document.getElementById("broadcastResult");if(!t||!m){box.className="accountError";box.textContent="⚠️ タイトルと内容を入力してください";return}if(!confirm("参加者全員へ送信しますか？"))return;broadcastParticipantNotification(t,m);box.className="accountOk";box.textContent="✅ 参加者全員へ送信しました"};
 let scheduleBroadcast=document.getElementById("scheduleBroadcast");if(scheduleBroadcast)scheduleBroadcast.onclick=()=>{const t=document.getElementById("broadcastTitle").value.trim(),m=document.getElementById("broadcastMessage").value.trim(),at=document.getElementById("broadcastSendAt").value,box=document.getElementById("broadcastResult");if(!t||!m||!at){box.className="accountError";box.textContent="⚠️ タイトル・内容・送信日時を入力してください";return}if(new Date(at).getTime()<=Date.now()){box.className="accountError";box.textContent="⚠️ 現在より後の日時を指定してください";return}scheduleParticipantNotice(t,m,new Date(at).toISOString());box.className="accountOk";box.textContent="✅ お知らせを予約しました";setTimeout(authManagementPage,700)};
 let sendParticipantNotification=document.getElementById("sendParticipantNotification");if(sendParticipantNotification)sendParticipantNotification.onclick=()=>{const aid=document.getElementById("notifyParticipantAccount").value,title=document.getElementById("notifyParticipantTitle").value.trim(),msg=document.getElementById("notifyParticipantMessage").value.trim(),box=document.getElementById("notifyParticipantResult");if(!aid||!title||!msg){box.className="accountError";box.textContent="⚠️ 参加者・タイトル・内容を入力してください";return}addParticipantNotification(aid,title,msg,"admin");box.className="accountOk";box.textContent="✅ お知らせを送信しました";document.getElementById("notifyParticipantTitle").value="";document.getElementById("notifyParticipantMessage").value=""};
 document.querySelectorAll(".regenerateRecovery").forEach(b=>b.onclick=()=>{const a=db.participantAccounts.find(x=>String(x.id)===String(b.dataset.id));if(a&&confirm(a.accountName+" の引き継ぎコードを再発行しますか？")){a.recoveryCode=makeRecoveryCode();save();alert("新しい引き継ぎコード: "+a.recoveryCode);authManagementPage()}});
 document.querySelectorAll(".resetParticipantDevice").forEach(b=>b.onclick=()=>{const a=db.participantAccounts.find(x=>String(x.id)===String(b.dataset.id));if(a&&confirm(a.accountName+" の端末登録をリセットしますか？")){a.deviceToken=makeDeviceToken();save();alert("リセットしました。新しい端末への再登録が可能です。")}});

function audit(action,detail="",category="操作"){
 db.auditLog=db.auditLog||[];
 db.auditLog.unshift({id:"log-"+Date.now()+"-"+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),action,detail,category});
 if(db.auditLog.length>300)db.auditLog.length=300;
 localStorage.setItem(KEY,JSON.stringify(db));
}
function auditLogPage(){
 const logs=db.auditLog||[];
 app.innerHTML=`<div class="card"><h3>🧾 変更履歴</h3><p class="muted">管理画面で行った主な操作を新しい順に記録します。最大300件です。</p><div class="auditFilter"><button class="btn soft auditFilterBtn active" data-cat="all">すべて</button>${[...new Set(logs.map(x=>x.category).filter(Boolean))].map(c=>`<button class="btn soft auditFilterBtn" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div><div id="auditList"></div></div>
 <div class="card"><button class="btn soft" id="auditBackup">🛟 バックアップ</button><button class="btn soft" id="auditBack">主催者画面へ戻る</button></div>`;
 const draw=(cat="all")=>{const list=cat==="all"?logs:logs.filter(x=>x.category===cat);document.getElementById("auditList").innerHTML=list.length?list.map(x=>`<div class="auditRow"><b>${esc(x.action)}</b> <span class="auditTag">${esc(x.category||"操作")}</span><div>${esc(x.detail||"")}</div><div class="auditTime">${esc(new Date(x.at).toLocaleString("ja-JP"))}</div></div>`).join(""):"<p class='muted'>履歴はありません。</p>"};
 draw();
 document.querySelectorAll(".auditFilterBtn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".auditFilterBtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");draw(b.dataset.cat)});
 document.getElementById("auditBackup").onclick=backupManagementPage;
 document.getElementById("auditBack").onclick=admin;
}

function createLocalBackup(reason="手動バックアップ"){
 const list=JSON.parse(localStorage.getItem("nagasaki_local_backups")||"[]");
 const snapshot={id:"bk-"+Date.now(),createdAt:new Date().toISOString(),reason,data:JSON.parse(JSON.stringify(db))};
 list.unshift(snapshot);while(list.length>10)list.pop();
 localStorage.setItem("nagasaki_local_backups",JSON.stringify(list));return snapshot;
}
function localBackups(){try{return JSON.parse(localStorage.getItem("nagasaki_local_backups")||"[]")}catch(e){return []}}
function restoreLocalBackup(id){
 const b=localBackups().find(x=>String(x.id)===String(id));if(!b)throw new Error("バックアップが見つかりません");
 db=JSON.parse(JSON.stringify(b.data));localStorage.setItem(KEY,JSON.stringify(db));eid=db.events?.[0]?.id||eid;localStorage.setItem("husrock-event",eid);return b;
}
function deleteLocalBackup(id){
 const list=localBackups().filter(x=>String(x.id)!==String(id));localStorage.setItem("nagasaki_local_backups",JSON.stringify(list));
}
function backupManagementPage(){
 const list=localBackups();
 app.innerHTML=`<div class="card"><h3>🛟 データバックアップ</h3><p class="muted">クラウド同期前などに、この端末へデータの控えを保存します。最新10件まで保持します。</p><button class="btn primary" id="makeBackupNow">今すぐバックアップ</button></div>
 <div class="card"><h3>保存済みバックアップ</h3>${list.length?list.map(b=>`<div class="backupRow"><b>${esc(new Date(b.createdAt).toLocaleString("ja-JP"))}</b> <span class="backupBadge">${esc(b.reason||"バックアップ")}</span><div class="backupActions"><button class="btn soft restoreBackup" data-id="${esc(b.id)}">この状態に戻す</button><button class="btn soft deleteBackup" data-id="${esc(b.id)}">削除</button></div></div>`).join(""):"<p class='muted'>まだバックアップはありません。</p>"}</div>
 <div class="card"><button class="btn soft" id="backupSyncStatus">☁️ 共有状態確認</button><button class="btn soft" id="backupAudit">🧾 変更履歴</button><button class="btn soft" id="backupBack">主催者画面へ戻る</button></div>`;
 document.getElementById("makeBackupNow").onclick=()=>{createLocalBackup("手動バックアップ");audit("手動バックアップ","端末内バックアップを作成","バックアップ");backupManagementPage()};
 document.querySelectorAll(".restoreBackup").forEach(b=>b.onclick=()=>{if(confirm("現在のデータをこのバックアップの状態に戻しますか？")){try{restoreLocalBackup(b.dataset.id);audit("バックアップ復元","過去の状態へ復元","バックアップ");alert("バックアップを復元しました");render()}catch(e){alert(e.message)}}});
 document.querySelectorAll(".deleteBackup").forEach(b=>b.onclick=()=>{if(confirm("このバックアップを削除しますか？")){deleteLocalBackup(b.dataset.id);backupManagementPage()}});
 document.getElementById("backupSyncStatus").onclick=cloudSyncStatusPage;
 document.getElementById("backupAudit").onclick=auditLogPage;
 document.getElementById("backupBack").onclick=admin;
}

function localModifiedAt(){const s=db.localLastModified||localStorage.getItem("nagasaki_local_last_modified")||"";return s?new Date(s):null}
function cloudLastSyncAt(){const s=db.cloudConfig?.lastSync||"";return s?new Date(s):null}
function syncConflictState(){
 const local=localModifiedAt(),sync=cloudLastSyncAt();
 return {local,sync,unsynced:!!(local&&(!sync||local.getTime()>sync.getTime()+1000))};
}

function cloudSyncHealth(){
 const c=db.cloudConfig||{},last=c.lastSync?new Date(c.lastSync):null,age=last?Date.now()-last.getTime():null;
 return {configured:!!(c.projectUrl&&(c.publishableKey||c.anonKey)),connected:!!c.connected,auto:!!c.autoSync,last,lastFresh:age!=null&&age<15*60*1000};
}
function cloudSyncStatusPage(){
 const h=cloudSyncHealth(),conflict=syncConflictState(),last=h.last?h.last.toLocaleString("ja-JP"):"まだ同期していません";
 app.innerHTML=`<div class="card"><h3>☁️ スマホ・PC共有 状態確認</h3><p class="muted">本番運用前に、どの端末でも同じ参加名簿・犬プロフィールが見える状態か確認します。</p><div class="syncHealth">
 <div class="syncHealthItem ${h.configured?"syncGood":"syncWarn"}"><strong>${h.configured?"設定済み":"未設定"}</strong>Supabase</div>
 <div class="syncHealthItem ${h.connected?"syncGood":"syncWarn"}"><strong>${h.connected?"ON":"OFF"}</strong>クラウド共有</div>
 <div class="syncHealthItem ${h.auto?"syncGood":"syncWarn"}"><strong>${h.auto?"ON":"OFF"}</strong>自動同期</div>
 <div class="syncHealthItem ${h.lastFresh?"syncGood":h.last?"syncWarn":""}"><strong>${h.lastFresh?"最新":h.last?"要確認":"未実行"}</strong>最終同期<div class="syncSmall">${esc(last)}</div></div></div></div>
 ${conflict.unsynced?`<div class="conflictBanner"><b>⚠️ この端末に未同期の変更があります</b><div class="deviceEditMeta">最終編集: ${esc(conflict.local?.toLocaleString("ja-JP")||"")}</div><div>別端末から読み込む前に、この端末の変更をクラウドへ保存してください。</div><div class="syncDecision"><button class="btn primary" id="pushLocalFirst">この端末の変更を保存</button></div></div>`:`<div class="conflictBanner conflictSafe"><b>✅ この端末に未同期の変更はありません</b></div>`}
 <div class="card"><h3>本番前チェック</h3><p>${h.configured&&h.connected&&h.auto?"✅ 基本設定は整っています。スマホとPCの2台で同期テストを行ってください。":"⚠️ まだ本番共有に必要な設定が残っています。"}</p><div class="actions"><button class="btn primary" id="syncHealthTest" ${h.configured&&h.connected?"":"disabled"}>🔄 今すぐ同期テスト</button><button class="btn soft" id="syncHealthDb">🗄️ 共有DB設定</button><button class="btn soft" id="syncHealthDevice">📱💻 複数端末テスト</button><button class="btn soft" id="syncHealthBackup">🛟 バックアップ</button></div><div id="syncHealthResult" class="muted"></div></div>`;
 let pushLocalFirst=document.getElementById("pushLocalFirst");if(pushLocalFirst)pushLocalFirst.onclick=async()=>{pushLocalFirst.disabled=true;pushLocalFirst.textContent="保存中…";try{createLocalBackup("クラウド保存前");await cloudDbPush();audit("クラウド保存","この端末の変更をクラウドへ保存","同期");const stamp=new Date().toISOString();db.cloudConfig.lastSync=stamp;db.localLastModified=stamp;localStorage.setItem("nagasaki_local_last_modified",stamp);localStorage.setItem(KEY,JSON.stringify(db));cloudSyncStatusPage()}catch(e){alert("クラウド保存に失敗しました: "+e.message);pushLocalFirst.disabled=false;pushLocalFirst.textContent="この端末の変更を保存"}};
 let t=document.getElementById("syncHealthTest");if(t)t.onclick=async()=>{const box=document.getElementById("syncHealthResult");box.textContent="同期テスト中…";try{createLocalBackup("同期テスト前");await cloudDbPush();const r=await cloudDbPull();db.cloudConfig.lastSync=new Date().toISOString();save();box.className="accountOk";box.textContent=r.found?"✅ 保存・読込とも成功しました":"⚠️ 保存しましたが読込データを確認できませんでした";setTimeout(cloudSyncStatusPage,900)}catch(e){box.className="accountError";box.textContent="❌ 同期テスト失敗: "+e.message}};
 document.getElementById("syncHealthDb").onclick=cloudDatabasePage;
 document.getElementById("syncHealthDevice").onclick=multiDeviceTestPage;
 document.getElementById("syncHealthBackup").onclick=backupManagementPage;
}

function cloudDatabasePage(){
 if(!canAdmin())return alert("管理者権限が必要です");
 const connected=!!db.cloudConfig?.connected;
 app.innerHTML=`<div class="card"><h3>🗄️ 共有データベース</h3><p class="muted">参加名簿・犬プロフィール・各陣の設定を、スマホとPCで同じデータとして共有するための機能です。</p><div class="cloudDbState ${connected?"cloudDbOk":"cloudDbWarn"}"><b>${connected?"☁️ Supabase接続済み":"⚠️ Supabase未接続"}</b><div>${connected?"共有DBの同期テストを実行できます。":"先にクラウド設定を行ってください。"}</div></div></div>

 <div class="card"><h3>Supabase側で必要なテーブル</h3><div class="setupCode">create table if not exists app_state (
  id text primary key,
  data jsonb not null,
  updated_at timestamptz default now()
);</div><p class="muted">試作品では既存データ構造をそのままJSONとして1件保存する方式です。正式運用時は認証/RLSを設定してください。</p></div>
 <div class="card"><button class="btn soft" id="cloudDbMulti">📱💻 複数端末テスト</button><button class="btn soft" id="cloudDbBack">主催者画面へ戻る</button></div>`;

function initCloudClient(){
 const c=db.cloudConfig||{};
 if(!c.projectUrl||!(c.publishableKey||c.anonKey)||!window.supabase)return null;
 try{cloudClient=window.supabase.createClient(c.projectUrl,c.publishableKey||c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return cloudClient}catch(e){return null}
}
async function testCloudConnection(){
 const s=initCloudClient();if(!s)return {ok:false,message:"接続情報またはSupabaseライブラリがありません"};
 try{
  const {error}=await s.from("events").select("id").limit(1);
  if(error)return {ok:false,message:error.message};
  return {ok:true,message:"Supabaseのeventsテーブルへ接続できました"};
 }catch(e){return {ok:false,message:e.message||"接続エラー"}}
}

async function enableRealtimeSync(){
 const s=initCloudClient();if(!s||!db.cloudConfig?.autoSync)return;
 if(realtimeChannel)try{await s.removeChannel(realtimeChannel)}catch(e){}
 let timer=null;
 const refresh=()=>{clearTimeout(timer);timer=setTimeout(async()=>{try{await cloudPullCore();cloudBadgeUpdate("☁️ 同期済み",true);render()}catch(e){cloudBadgeUpdate("☁️ 同期エラー",false)}},700)};
 realtimeChannel=s.channel("nagasaki-live")
   .on("postgres_changes",{event:"*",schema:"public",table:"events"},refresh)
   .on("postgres_changes",{event:"*",schema:"public",table:"owners"},refresh)
   .on("postgres_changes",{event:"*",schema:"public",table:"dogs"},refresh)
   .on("postgres_changes",{event:"*",schema:"public",table:"applications"},refresh)
   .on("postgres_changes",{event:"*",schema:"public",table:"media"},refresh)
   .subscribe();
}
async function startCloudRuntime(){

 const s=initCloudClient();if(!s){cloudBadgeUpdate("☁️ 未接続",false);return}
 try{
   const session=await cloudSessionInfo();
   if(session)await refreshCloudEventRole();else cloudEventRole=null;
   cloudBadgeUpdate(session?"☁️ クラウド接続":"☁️ 接続・未ログイン",!!session);
   if(db.cloudConfig?.autoSync&&session){
     await cloudPullCore();
     cloudBadgeUpdate("☁️ 同期済み",true);
     await enableRealtimeSync();
   }
   s.auth.onAuthStateChange(async(event,session)=>{
     if(session)await refreshCloudEventRole();else cloudEventRole=null;
     cloudBadgeUpdate(session?"☁️ クラウド接続":"☁️ 接続・未ログイン",!!session);
     if(session&&db.cloudConfig?.autoSync){try{await cloudPullCore();await refreshCloudEventRole();await enableRealtimeSync();render()}catch(e){}}if(event==="SIGNED_IN"){cloudBadgeUpdate("☁️ ログイン済み",true)}
   });
 }catch(e){cloudBadgeUpdate("☁️ 接続エラー",false)}
}

async function cloudPullCore(){
 const s=initCloudClient();if(!s)throw new Error("Supabase接続が未設定です");
 const [ev,ow,dg,ap]=await Promise.all([
   s.from("events").select("*").order("event_date",{ascending:false}),
   s.from("owners").select("*"),
   s.from("dogs").select("*"),
   s.from("applications").select("*,application_dogs(dog_id)")
 ]);
 for(const r of [ev,ow,dg,ap])if(r.error)throw r.error;
 if(ev.data?.length)db.events=ev.data.map(x=>({id:x.id,name:x.name,shortName:x.short_name||x.name,date:x.event_date||"",place:x.place||"",deadline:x.deadline||"",announcements:[],gallery:[],applications:ap.data.filter(a=>a.event_id===x.id).map(a=>({id:a.id,owner:(ow.data.find(o=>o.id===a.owner_id)||{}).name||"",ownerId:a.owner_id,people:a.people,status:a.status,dogIds:(a.application_dogs||[]).map(z=>z.dog_id)}))}));
 if(ow.data)db.owners=ow.data.map(o=>({id:o.id,name:o.name,contact:o.contact||"",dogIds:dg.data.filter(d=>d.owner_id===o.id).map(d=>d.id)}));
 if(dg.data)db.dogs=dg.data.map(d=>({id:d.id,name:d.name,sex:d.sex||"",dob:d.dob||"",breeder:d.breeder||"",sns:d.sns||"",photo:d.photo_path||""}));
 save();db.cloudConfig.lastSync=new Date().toISOString();save();return {events:ev.data.length,owners:ow.data.length,dogs:dg.data.length,applications:ap.data.length};
}
async function cloudPushCore(){
 const s=initCloudClient();if(!s)throw new Error("Supabase接続が未設定です");
 // Upsert events, owners, dogs. Applications are migrated after IDs/relations exist.
 const events=db.events.map(x=>({id:isUUID(x.id)?x.id:undefined,name:x.name,short_name:x.shortName||x.name,event_date:x.date||null,place:x.place||"",deadline:x.deadline||null})).map(cleanUndefined);
 const owners=db.owners.map(o=>({id:isUUID(o.id)?o.id:undefined,name:o.name,contact:o.contact||""})).map(cleanUndefined);
 // For old local IDs, owner relation is omitted on first migration to avoid invalid UUID references.
 const dogs=db.dogs.map(d=>{let owner=db.owners.find(o=>(o.dogIds||[]).includes(d.id));return cleanUndefined({id:isUUID(d.id)?d.id:undefined,owner_id:owner&&isUUID(owner.id)?owner.id:undefined,name:d.name,sex:d.sex||"",dob:d.dob||null,breeder:d.breeder||"",sns:d.sns||"",photo_path:(d.photo||"").startsWith("http")?d.photo:null})});
 for(const [table,rows] of [["events",events],["owners",owners],["dogs",dogs]]){if(!rows.length)continue;const r=await s.from(table).upsert(rows);if(r.error)throw r.error}
 db.cloudConfig.lastSync=new Date().toISOString();save();return {events:events.length,owners:owners.length,dogs:dogs.length};
}
function isUUID(v){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v||"")}
function cleanUndefined(o){return Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined))}

function selfCheckinRequestFor(accountId,dogId){
 return (db.selfCheckinRequests||[]).find(r=>String(r.accountId)===String(accountId)&&String(r.dogId)===String(dogId)&&r.status==="pending");
}
function requestSelfCheckin(accountId,dogId){
 const d=db.dogs.find(x=>String(x.id)===String(dogId));
 if(!d||String(d.ownerAccountId||"")!==String(accountId))throw new Error("自分の犬だけ受付申請できます");
 if(selfCheckinRequestFor(accountId,dogId))throw new Error("すでに受付申請済みです");
 db.selfCheckinRequests.push({id:"scr-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),accountId,dogId,status:"pending",createdAt:new Date().toISOString()});save();
}
function pendingSelfCheckins(){return (db.selfCheckinRequests||[]).filter(r=>r.status==="pending")}
function decideSelfCheckin(id,approve){
 const ev=e(),r=db.selfCheckinRequests.find(x=>String(x.id)===String(id));if(!r)return;
 const d=db.dogs.find(x=>String(x.id)===String(r.dogId));
 if(approve){ev.checkins=ev.checkins||{};ev.checkins[String(r.dogId)]={checked:true,checkedAt:new Date().toISOString(),source:"participant-request"};r.status="approved";addParticipantNotification(r.accountId,"受付が完了しました",(d?.name||"犬")+" の来場受付が完了しました。","checkin")}
 else{r.status="rejected";addParticipantNotification(r.accountId,"受付申請について",(d?.name||"犬")+" の受付申請は確認できませんでした。受付スタッフへお声がけください。","checkin")}
 r.decidedAt=new Date().toISOString();save();
}

function downloadTextFile(filename,text,mime="text/plain;charset=utf-8"){
 const blob=new Blob(["\ufeff"+text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

   candidates.forEach(el=>{const k=ownerKey(el);if(!k||ownerCounts[k]<2||el.querySelector(".multiDogHint"))return;const hint=document.createElement("span");hint.className="multiDogHint";hint.textContent=`同じ飼い主 ${ownerCounts[k]}頭`;const first=el.querySelector("b,strong,.dogName,.name")||el;first.appendChild(hint)});

   let receptionFilter="all",kanaFilter="all";
   const kanaGroup=ch=>{
     ch=(ch||"").normalize("NFKC").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
     if(/[ぁ-お]/.test(ch))return "あ";if(/[か-ご]/.test(ch))return "か";if(/[さ-ぞ]/.test(ch))return "さ";if(/[た-ど]/.test(ch))return "た";if(/[な-の]/.test(ch))return "な";if(/[は-ぽ]/.test(ch))return "は";if(/[ま-も]/.test(ch))return "ま";if(/[ゃ-よ]/.test(ch))return "や";if(/[ら-ろ]/.test(ch))return "ら";if(/[ゎ-ん]/.test(ch))return "わ";return "他";
   };

       const txt=(el.innerText||el.textContent||"").toLowerCase(),checked=isCheckedCard(el);if(checked)checkedTotal++;

       const first=((el.innerText||el.textContent||"").trim().replace(/^[^ぁ-んァ-ヶ一-龠A-Za-z0-9]+/,"")[0]||"");

   candidates.forEach(el=>{

   });
   applyReceptionSearch();setTimeout(()=>searchInput.focus(),50);
 }

function reopenFinishedEvent(targetId){
 const target=(db.events||[]).find(x=>String(x.id)===String(targetId));if(!target)return alert("イベントが見つかりません");
 if(!target.finishedAt)return alert("終了操作で閉じたイベントではありません。");
 if(Number(target.year)<new Date().getFullYear())return alert("過去年度のイベントは履歴として保持します。");
 const current=liveEvent();
 const msg=current&&String(current.id)!==String(target.id)
   ?`現在「${current.name||current.shortName||"イベント"}」が開催用です。\nそれを準備中に戻して「${target.name||target.shortName||"イベント"}」を再開しますか？`
   :`「${target.name||target.shortName||"イベント"}」を開催用として再開しますか？`;
 if(!confirm(msg))return;
 createLocalBackup("イベント再開前");
 (db.events||[]).forEach(x=>{if(x.status==="open")x.status="draft"});
 target.status="open";target.reopenedAt=new Date().toISOString();target.finishedAt=null;target.isHistorical=false;
 eid=target.id;localStorage.setItem("husrock-event",eid);
 audit("イベント再開",target.name||target.shortName||target.id,"イベント");save();
 alert("イベントを開催用として再開しました。");
 eventArchivePage();
}

function finishLiveEvent(){
 const ev=e();if(!ev)return alert("イベントが見つかりません");
 if(eventStatus(ev)!=="open")return alert("このイベントは開催用ではありません。");
 if(!confirm(`「${ev.name||ev.shortName||"イベント"}」を終了しますか？\n終了後は当日受付ができなくなります。`))return;
 createLocalBackup("イベント終了前");
 ev.status="closed";
 ev.finishedAt=new Date().toISOString();
 ev.isHistorical=Number(ev.year)<new Date().getFullYear();
 audit("イベント終了",ev.name||ev.shortName||ev.id,"イベント");
 save();
 alert("イベントを終了しました。開催結果を確認できます。");
 postEventSummaryPage();
}

function localDateKey(d=new Date()){
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}
function eventDateStateHtml(ev){
 const raw=String(ev?.eventDate||ev?.date||"").slice(0,10);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(raw))return `<span class="eventDateState">開催日未設定</span>`;
 const today=localDateKey();
 if(raw===today)return `<span class="eventDateState eventDateToday">📅 本日開催</span>`;
 if(raw>today)return `<span class="eventDateState eventDateFuture">📅 開催日前</span>`;
 return `<span class="eventDateState eventDatePast">📅 開催日経過</span>`;
}


function eventDateCautionHtml(ev){
 const raw=String(ev?.eventDate||ev?.date||"").slice(0,10),today=localDateKey();
 if(!/^\d{4}-\d{2}-\d{2}$/.test(raw))return `<div class="eventDateCaution"><b>⚠️ 開催日が未設定です</b>イベント基本情報の開催日を確認してください。</div>`;
 if(raw===today)return "";
 if(raw>today)return `<div class="eventDateCaution"><b>⚠️ このイベントはまだ開催日前です</b>受付するイベントを間違えていないか確認してください。</div>`;

}

}

function adminLoginPage(){

 document.getElementById("loginEmailBtn").onclick=async()=>{
 const email=document.getElementById("loginEmail").value.trim().toLowerCase();
 if(!email)return alert("メールアドレスを入力してください");
 const session=await cloudSessionInfo().catch(()=>null);
 if(!session?.user?.email)return alert("先に右側の『管理者用クラウド接続』からSupabaseにログインしてください。メールアドレスだけでは管理者として認証できません。");
 if(session.user.email.trim().toLowerCase()!==email)return alert("クラウドでログイン中のメールアドレスと一致しません。ログイン中のメールアドレスを入力してください。");
 let a=(db.admins||[]).find(x=>(x.email||"").trim().toLowerCase()===email&&x.status==="active"&&x.enabled!==false);
 if(!a){
   // Only the authenticated owner recorded in Supabase may claim the legacy owner entry.
   // Never grant admin privileges solely because an email was typed into the form.
   try{
     const client=initCloudClient();
     if(!client)throw new Error("Supabase接続が未設定です");
     const {data:identity,error:identityError}=await client.auth.getUser();
     if(identityError||!identity?.user?.id||identity.user.email?.trim().toLowerCase()!==email)
       throw new Error("Supabaseの本人確認ができませんでした");
     const {data:members,error:memberError}=await client.from("event_members")
       .select("event_id,user_id,role").eq("user_id",identity.user.id).eq("role","owner").limit(1);
     if(memberError)throw memberError;
     const legacy=(db.admins||[]).find(x=>x.id==="admin-main"&&x.role==="オーナー"&&x.enabled!==false&&!x.email);
     if(members?.length&&legacy){
       legacy.email=email;legacy.status="active";a=legacy;
     }
   }catch(err){console.warn("管理者照合:",err);alert("管理者権限の照合ができませんでした: "+(err.message||err));return;}
 }
 if(!a)return alert("Supabaseのオーナー登録と、このアプリの管理者登録が一致しません。管理者設定を確認してください。");
 db.currentAdminId=a.id;save();alert(a.name+"さんでログインしました");go("admin");
};

}

function dogAge(dob){
 if(!dob)return "未登録";
 const b=new Date(dob), now=new Date();
 if(isNaN(b))return "未登録";
 let age=now.getFullYear()-b.getFullYear();
 const md=now.getMonth()-b.getMonth();
 if(md<0||(md===0&&now.getDate()<b.getDate()))age--;
 return `${dob.replaceAll("-","/")}（${age}歳）`;
}

 app.innerHTML=`<div class="card"><h3>👤 飼い主情報</h3><label>飼い主名</label><input id="oname" value="${esc(o.name)}"><label>連絡先</label><input id="ocontact" value="${esc(o.contact||"")}"><label>愛犬</label><div class="dogchips">${db.dogs.map(d=>`<label class="dogchip"><input class="ownerdog" type="checkbox" value="${d.id}" ${(o.dogIds||[]).includes(d.id)?"checked":""} style="width:auto;margin:0 5px 0 0">${esc(d.name)}</label>`).join("")}</div><label>メモ</label><textarea id="omemo" rows="4">${esc(o.memo||"")}</textarea><button class="btn primary" id="ownerSave">保存</button></div>`;

function repeatOwner(id){

function submit(){
 let dogIds=[...document.querySelectorAll(".dogcheck:checked")].map(x=>x.value);
 if(!dogIds.length)return alert("参加する犬を1頭以上選んでください");
 let owner=document.getElementById("owner").value.trim();if(!owner)return alert("飼い主さんのお名前を入力してください");
 e().applications=e().applications||[];
 let contact=document.getElementById("contact").value;let om=db.owners.find(o=>o.name===owner&&(o.contact||"")===(contact||""));if(!om){om={id:"owner-"+Date.now(),name:owner,contact,dogIds:[...dogIds],memo:""};db.owners.push(om)}else{dogIds.forEach(id=>{if(!om.dogIds.includes(id))om.dogIds.push(id)})}
 e().applications.push({id:"app-"+Date.now(),ownerId:om.id,dogIds,owner,contact,people:Number(document.getElementById("people").value||1),createdAt:new Date().toISOString(),checkedIn:false,memo:"",status:"参加"});
 save();alert("参加登録しました！");go("home")
}
function exportCSV(){let rows=[["参加犬","飼い主","連絡先","人数","状態","当日受付","主催者メモ"]];apps().forEach(x=>{let names=(x.dogIds||[x.dogId]).map(id=>db.dogs.find(y=>y.id===id)?.name||"").filter(Boolean).join("・");rows.push([names,x.owner,x.contact,x.people,x.status||"参加",x.checkedIn?"受付済":"未受付",x.memo||""])});let csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");download("参加者名簿.csv",csv,"text/csv;charset=utf-8")}
function download(n,c,t){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let f=i.files[0],r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);eid=db.events[0].id;save();render();alert("復元しました")}catch{alert("読み込めませんでした")}};r.readAsText(f)};i.click()}

if(location.hash.startsWith("#event=")){let id=location.hash.split("=")[1];if(db.events.some(x=>x.id===id)){eid=id;save();location.hash="home"}}
let deferredPrompt=null;window.addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();deferredPrompt=ev});
if(location.hash.startsWith("#event=")){let wanted=location.hash.split("=")[1];if(db.events.some(x=>x.id===wanted)){eid=wanted;save();page="home"}}render();
</script>

const NagasakiRealtime={
 es:null,
 reconnectTimer:null,
 watchdogTimer:null,
 lastMessageAt:0,
 startWatchdog(){
   clearInterval(this.watchdogTimer);
   this.watchdogTimer=setInterval(()=>{
     if(!this.es)return;
     const age=Date.now()-Number(this.lastMessageAt||Date.now());
     if(age>90000){
       SyncAudit.add("realtime-stalled",{ageMs:age});
       window.dispatchEvent(new CustomEvent("nagasaki:realtime-stalled"));
       this.close();
       clearTimeout(this.reconnectTimer);
       this.reconnectTimer=setTimeout(()=>this.connect(),5000);
     }
   },15000);
 },
 connect(){
   try{
     if(!NagasakiSync?.enabled||!NagasakiSync.endpoint||!navigator.onLine||document.visibilityState!=="visible")return;
     if(typeof EventSource==="undefined")return;
     if(this.es)return;
     const base=NagasakiSync.endpoint;
     const u=base+(base.includes("?")?"&":"?")+"type=stream&deviceId="+encodeURIComponent(NagasakiSync.deviceId)+"&sessionId="+encodeURIComponent(NagasakiSync.sessionId)+"&knownRevision="+encodeURIComponent(NagasakiSync.remoteRevision||"")+"&eventId="+encodeURIComponent((typeof eid!=="undefined"&&eid!=null)?String(eid):"")+"&eventLifecycle="+encodeURIComponent(eventSyncMeta().lifecycle);
     this.es=new EventSource(u);
     this.es.addEventListener("message",async e=>{
       this.lastMessageAt=Date.now();
       try{
         const msg=JSON.parse(e.data||"{}");
         if(msg.revision!=null&&String(msg.revision)===String(NagasakiSync.remoteRevision||""))return;
         SyncAudit.add("realtime-change",{revision:msg.revision??null});
         if(NagasakiSync.claimLeader())await NagasakiSync.pull();
       }catch(_){}
     });
     this.es.addEventListener("open",()=>{
       this.lastMessageAt=Date.now();
       this.startWatchdog();
       window.dispatchEvent(new CustomEvent("nagasaki:realtime-open"));
     });
     this.es.addEventListener("error",()=>{
       this.close();
       clearTimeout(this.reconnectTimer);
       this.reconnectTimer=setTimeout(()=>this.connect(),15000);
     });
   }catch(_){}
 },
 close(){
   try{this.es?.close()}catch(_){}
   this.es=null;
   clearInterval(this.watchdogTimer);this.watchdogTimer=null;
 }
};

   await NagasakiSync.pull();
   SyncAudit.add("foreground-sync-complete",{reason,sessionId:NagasakiSync.sessionId});
 }catch(err){
   SyncAudit.add("foreground-sync-error",{reason,message:String(err),sessionId:NagasakiSync.sessionId});
 }finally{
   NagasakiSync.releaseForegroundSync();
 }
}

const NagasakiCompatibility={
 currentSchema:211,
 checkRemote(payload){
   const remote=Number(payload?.schemaVersion??payload?.data?.schemaVersion??0);
   if(!remote)return {ok:true,remote:0};
   if(remote>this.currentSchema){
     SyncAudit.add("remote-schema-too-new",{remote,local:this.currentSchema});
     window.dispatchEvent(new CustomEvent("nagasaki:schema-incompatible",{detail:{remote,local:this.currentSchema}}));
     return {ok:false,remote};
   }

const NagasakiConflictRetry={
 attempts:new Map(),
 maxAttempts:3,
 key(changeId){return `${NagasakiSync.operationScope()}|${changeId||"unknown"}`},
 note(changeId){
   const k=this.key(changeId),n=(this.attempts.get(k)||0)+1;
   this.attempts.set(k,n); return n;
 },
 clear(changeId){this.attempts.delete(this.key(changeId))}
};

window.addEventListener("nagasaki:sync-conflict",async e=>{
 try{
   const changeId=e.detail?.changeId||null;
   const attempt=NagasakiConflictRetry.note(changeId);
   if(attempt>NagasakiConflictRetry.maxAttempts){
     SyncAudit.add("conflict-auto-retry-stopped",{changeId,attempts:attempt-1});
     const el=document.getElementById("receptionSyncFreshness")||document.getElementById("syncLastState");
     if(el)el.textContent="他端末との更新競合を保留中（データは端末に保存済み）";
     return;
   }
   setTimeout(async()=>{
     try{
       if(!navigator.onLine||!NagasakiSync.claimForegroundSync())return;
       try{
         if(!NagasakiSync.claimLeader())return;
         const pulled=await NagasakiSync.pull();
         if(pulled?.status==="timeout"||pulled?.status==="error"||pulled?.status==="schema-incompatible"||pulled?.status==="scope-changed")return;
         const flushed=await NagasakiSync.flushQueue();
         if(flushed?.status==="ok"||flushed?.status==="empty"){
           NagasakiConflictRetry.clear(changeId);
           SyncAudit.add("conflict-retry-resolved",{changeId,attempt});
         }
       }finally{NagasakiSync.releaseForegroundSync()}
     }catch(err){
       SyncAudit.add("conflict-retry-error",{changeId,attempt,message:String(err)});
     }
   },Math.min(5000,800*attempt));
 }catch(_){}
});


const NagasakiActionGuard={
 windowMs:1800,
 last:new Map(),
 fingerprint(action){
   try{
     return [
       NagasakiSync.operationScope(),
       action?.type||action?.action||"change",
       action?.memberId||action?.participantId||action?.id||"",
       action?.status||action?.value||""
     ].join("|");
   }catch(_){return ""}
 },
 accept(action){
   const key=this.fingerprint(action);
   if(!key)return true;
   const now=Date.now(),prev=this.last.get(key)||0;
   if(now-prev<this.windowMs){
     SyncAudit.add("duplicate-action-blocked",{key,withinMs:now-prev});
     window.dispatchEvent(new CustomEvent("nagasaki:duplicate-action",{detail:{key}}));
     return false;
   }
   this.last.set(key,now);
   setTimeout(()=>{if((this.last.get(key)||0)===now)this.last.delete(key)},this.windowMs+500);
   return true;
 }
};

const NagasakiStaleTabGuard={
 staleAfterMs:30000,
 backgroundAt:0,
 needsRefresh:false,
 refreshing:null,
 markBackground(){
   this.backgroundAt=Date.now();
 },
 markForeground(){
   const away=this.backgroundAt?Date.now()-this.backgroundAt:0;
   if(away>=this.staleAfterMs){
     this.needsRefresh=true;
     SyncAudit.add("stale-tab-refresh-required",{awayMs:away,sessionId:NagasakiSync.sessionId});
   }
   return away;
 },
 async refresh(){
   if(!this.needsRefresh)return true;
   if(!navigator.onLine)return true; // offline reception must remain usable
   if(this.refreshing)return this.refreshing;
   this.refreshing=(async()=>{
     try{
       const r=await NagasakiSync.pull();
       const ok=!(r?.status==="timeout"||r?.status==="error"||r?.status==="schema-incompatible"||r?.status==="scope-changed");
       if(ok){
         this.needsRefresh=false;
         SyncAudit.add("stale-tab-refresh-complete",{sessionId:NagasakiSync.sessionId});
       }
       return ok;
     }catch(_){return false}
     finally{this.refreshing=null}
   })();
   return this.refreshing;
 }
};

 if(document.visibilityState==="hidden")NagasakiStaleTabGuard.markBackground();
 else NagasakiStaleTabGuard.markForeground();
});

// Preserve synchronous enqueue semantics: after a stale return, refresh first,
// then enqueue the exact same change. Offline continues immediately.
const nagasakiV190Enqueue=NagasakiSync.enqueue.bind(NagasakiSync);
NagasakiSync.enqueue=function(change){
 if(!NagasakiStaleTabGuard.needsRefresh||!navigator.onLine)return nagasakiV190Enqueue(change);
 const saved=change;
 NagasakiStaleTabGuard.refresh().then(ok=>{
   if(ok)nagasakiV190Enqueue(saved);
   else{
     // Do not lose the user's action if refresh cannot complete.
     nagasakiV190Enqueue(saved);
     NagasakiSync.markDirty("stale-tab-refresh-pending");
   }
 });
};

NagasakiSync.enqueue=function(change){
 const before=NagasakiSync.getQueue().length;
 const result=nagasakiV191Enqueue(change);
 setTimeout(()=>{
   try{
     const q=NagasakiSync.getQueue();
     const queued=change?.changeId?q.some(x=>x?.changeId===change.changeId):q.length>before;

 detect(){
   try{
     const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
     const s={
       at:new Date().toISOString(),
       online:navigator.onLine,
       effectiveType:c?.effectiveType||"unknown",
       downlink:Number(c?.downlink||0),
       rtt:Number(c?.rtt||0),
       saveData:!!c?.saveData
     };
     this.state=s;
     try{localStorage.setItem(NagasakiSync.scopedKey("nagasaki-network-quality"),JSON.stringify(s))}catch(_){}
     const weak=s.effectiveType==="slow-2g"||s.effectiveType==="2g"||s.rtt>=1200||(s.downlink>0&&s.downlink<0.3);
     if(weak){
       SyncAudit.add("weak-network-detected",s);
       window.dispatchEvent(new CustomEvent("nagasaki:weak-network",{detail:s}));
     }
     return s;
   }catch(_){return null}
 },
 retryDelay(base=1000){
   const s=this.state||this.detect();
   if(!s)return base;
   if(s.effectiveType==="slow-2g"||s.effectiveType==="2g")return Math.max(base,5000);
   if(s.effectiveType==="3g"||s.rtt>=700)return Math.max(base,2500);
   return base;
 }
};

const NagasakiProductionGate={
 evaluate(){
   const issues=[],warnings=[];
   const push=(arr,name,detail="")=>arr.push({name,detail});
   try{
     const q=NagasakiSync.recoverQueueMirror();
     if(q.length)push(warnings,"未送信データ",`${q.length}件`);
   }catch(_){}
   try{if(NagasakiSync.isDirty())push(warnings,"同期確認待ち","端末内データ保護中")}catch(_){}
   if(!navigator.onLine)push(warnings,"オフライン","受付継続可能");
   try{
     if(localStorage.getItem("nagasaki-post-update-sync-required")==="1")
       push(warnings,"更新後確認","最新データ確認待ち");
   }catch(_){}
   try{
     const n=NagasakiNetworkQuality?.state;
     if(n&&(n.effectiveType==="slow-2g"||n.effectiveType==="2g"||n.rtt>=1200))
       push(warnings,"通信品質","低速または高遅延");
   }catch(_){}
   try{
     const c=JSON.parse(localStorage.getItem(NagasakiSync.scopedKey("nagasaki-clock-health"))||"null");
     if(c&&Math.abs(Number(c.skewMs||0))>=120000)push(warnings,"端末時刻","2分以上のずれ");
   }catch(_){}
   try{
     const s=JSON.parse(localStorage.getItem(NagasakiSync.scopedKey("nagasaki-storage-health"))||"null");
     if(s&&Number(s.ratio||0)>=.85)push(warnings,"保存容量","85%以上使用");
   }catch(_){}
   try{
     const p=JSON.parse(localStorage.getItem(NagasakiSync.scopedKey("nagasaki-preflight-last"))||"null");
     if(p&&p.items?.some(x=>!x.ok&&x.name!=="通信"))push(issues,"本番前チェック","要確認項目あり");
   }catch(_){}
   const status=issues.length?"attention":warnings.length?"caution":"ok";
   const result={at:new Date().toISOString(),status,issues,warnings,eventId:(typeof eid!=="undefined"&&eid!=null)?String(eid):"global"};
   try{localStorage.setItem(NagasakiSync.scopedKey("nagasaki-production-gate"),JSON.stringify(result))}catch(_){}
   SyncAudit.add("production-gate",{status,issues:issues.map(x=>x.name),warnings:warnings.map(x=>x.name)});
   window.dispatchEvent(new CustomEvent("nagasaki:production-gate",{detail:result}));
   return result;
 }
};

const NagasakiApiCapability={
 key(){return NagasakiSync.scopedKey("nagasaki-api-capability")},
 state:null,
 async check(){
   if(!navigator.onLine)return {status:"offline"};
   try{
     const sep=NagasakiSync.endpoint.includes("?")?"&":"?";
     const url=NagasakiSync.endpoint+sep+"type=capabilities&schemaVersion=199&deviceId="+encodeURIComponent(NagasakiSync.deviceId||"")+"&sessionId="+encodeURIComponent(NagasakiSync.sessionId||"");
     const ctrl=new AbortController();
     const timer=setTimeout(()=>ctrl.abort(),Math.max(5000,Number(NagasakiSync.timeoutMs||8000)));
     let res;
     try{res=await fetch(url,{method:"GET",cache:"no-store",signal:ctrl.signal,headers:{"Accept":"application/json"}})}
     finally{clearTimeout(timer)}
     if(!res.ok){
       const state={at:new Date().toISOString(),status:"http-error",httpStatus:res.status};
       this.state=state; localStorage.setItem(this.key(),JSON.stringify(state));
       SyncAudit.add("api-capability-http-error",{status:res.status});
       return state;
     }
     let data={};
     try{data=await res.json()}catch(_){}
     const caps=data?.capabilities||data||{};
     const state={
       at:new Date().toISOString(),
       status:"ok",
       apiVersion:caps.apiVersion||null,
       schemaVersion:Number(caps.schemaVersion||0)||null,
       realtime:!!caps.realtime,
       conflictDetection:!!(caps.conflictDetection||caps.revisionConflict),
       idempotency:!!(caps.idempotency||caps.changeIdDeduplication),
       multiDevice:caps.multiDevice!==false,
       eventScoped:caps.eventScoped!==false
     };
     this.state=state;
     localStorage.setItem(this.key(),JSON.stringify(state));
     const missing=[];
     if(!state.conflictDetection)missing.push("競合検出");
     if(!state.idempotency)missing.push("重複送信防止");
     if(!state.multiDevice)missing.push("複数端末");
     if(!state.eventScoped)missing.push("イベント分離");
     if(missing.length){
       SyncAudit.add("api-capability-missing",{missing});
       window.dispatchEvent(new CustomEvent("nagasaki:api-capability-warning",{detail:{state,missing}}));
     }else{
       SyncAudit.add("api-capability-ok",{apiVersion:state.apiVersion});
       window.dispatchEvent(new CustomEvent("nagasaki:api-capability-ok",{detail:state}));
     }
     return state;
   }catch(err){
     const state={at:new Date().toISOString(),status:err?.name==="AbortError"?"timeout":"error",message:String(err)};
     this.state=state;
     try{localStorage.setItem(this.key(),JSON.stringify(state))}catch(_){}
     SyncAudit.add("api-capability-check-error",{status:state.status,message:state.message});
     return state;
   }
 }
};

const NagasakiReleaseCandidate={
 version:"200-rc1",
 required:[
   ["sync",()=>!!window.NagasakiSync],
   ["audit",()=>!!window.SyncAudit],
   ["readiness",()=>!!window.NagasakiReadiness],
   ["preflight",()=>!!window.NagasakiPreflight],
   ["compatibility",()=>!!window.NagasakiCompatibility],
   ["updateSafety",()=>!!window.NagasakiUpdateSafety],
   ["storageHealth",()=>!!window.NagasakiStorageHealth],
   ["clockHealth",()=>!!window.NagasakiClockHealth],
   ["networkQuality",()=>!!window.NagasakiNetworkQuality],
   ["productionGate",()=>!!window.NagasakiProductionGate],
   ["apiCapability",()=>!!window.NagasakiApiCapability],
   ["recoveryCheckpoint",()=>!!window.NagasakiRecoveryCheckpoint],
   ["receipts",()=>!!window.NagasakiReceipts]
 ],
 verify(){
   const checks=this.required.map(([name,fn])=>{
     let ok=false; try{ok=!!fn()}catch(_){}
     return {name,ok};
   });
   const result={
     at:new Date().toISOString(),
     release:this.version,
     schemaVersion:211,
     passed:checks.filter(x=>x.ok).length,
     total:checks.length,
     ok:checks.every(x=>x.ok),
     checks
   };
   try{localStorage.setItem(NagasakiSync.scopedKey("nagasaki-release-candidate"),JSON.stringify(result))}catch(_){}
   SyncAudit.add("release-candidate-check",{release:this.version,passed:result.passed,total:result.total,ok:result.ok});
   window.dispatchEvent(new CustomEvent("nagasaki:release-candidate",{detail:result}));
   return result;
 }
};

const NagasakiServerContract={
 version:"202-rc3",
 endpointState(){
   const ep=String(NagasakiSync.endpoint||"").trim();
   const placeholder=!ep||/example\.com|localhost|127\.0\.0\.1|YOUR_|REPLACE_|dummy/i.test(ep);
   let secure=false;
   try{secure=new URL(ep,location.href).protocol==="https:"}catch(_){}
   return {endpoint:ep,configured:!placeholder,secure};
 },
 evaluate(){
   const ep=this.endpointState();
   const caps=NagasakiApiCapability?.state||null;
   const requirements={
     endpointConfigured:ep.configured,
     https:ep.secure,
     capabilityHandshake:caps?.status==="ok",
     multiDevice:caps?.multiDevice===true,
     eventScoped:caps?.eventScoped===true,
     conflictDetection:caps?.conflictDetection===true,
     idempotency:caps?.idempotency===true
   };
   const result={
     at:new Date().toISOString(),
     release:this.version,
     schemaVersion:211,
     endpoint:ep,
     requirements,
     ready:Object.values(requirements).every(Boolean)
   };
   try{localStorage.setItem(NagasakiSync.scopedKey("nagasaki-server-contract"),JSON.stringify(result))}catch(_){}
   SyncAudit.add("server-contract-check",{ready:result.ready,requirements});
   return result;
 }
};

const NagasakiDeploymentConfig={
 key:"nagasaki-deployment-config",
 defaults:{
   environment:"unconfigured",
   apiBase:"",
   authMode:"unconfigured",
   tenant:"",
   updatedAt:null
 },
 load(){
   try{return {...this.defaults,...JSON.parse(localStorage.getItem(this.key)||"{}")}}
   catch(_){return {...this.defaults}}
 },
 save(next){
   const cfg={...this.load(),...next,updatedAt:new Date().toISOString()};
   localStorage.setItem(this.key,JSON.stringify(cfg));
   this.apply(cfg);
   SyncAudit.add("deployment-config-updated",{environment:cfg.environment,authMode:cfg.authMode,hasApiBase:!!cfg.apiBase});
   return cfg;
 },
 apply(cfg=this.load()){
   try{
     if(cfg.apiBase&&/^https:\/\//i.test(cfg.apiBase)){
       NagasakiSync.endpoint=cfg.apiBase.replace(/\/+$/,"");
     }
   }catch(_){}
   return cfg;
 },
 status(){
   const cfg=this.load();
   return {
     configured:cfg.environment!=="unconfigured"&&/^https:\/\//i.test(cfg.apiBase)&&cfg.authMode!=="unconfigured",
     environment:cfg.environment,
     secure:/^https:\/\//i.test(cfg.apiBase),
     authConfigured:cfg.authMode!=="unconfigured",
     tenantConfigured:!!cfg.tenant
   };
 }
};

const NagasakiConfigValidator={
 validate(cfg=NagasakiDeploymentConfig.load()){
   const errors=[],warnings=[];
   const add=(arr,field,message)=>arr.push({field,message});
   const env=String(cfg.environment||"").trim();
   const api=String(cfg.apiBase||"").trim();
   const auth=String(cfg.authMode||"").trim();
   const tenant=String(cfg.tenant||"").trim();

   if(!env||env==="unconfigured")add(errors,"environment","環境名が未設定");
   if(!api)add(errors,"apiBase","API URLが未設定");
   else{
     try{
       const u=new URL(api);
       if(u.protocol!=="https:")add(errors,"apiBase","HTTPSではありません");
       if(/example\.|localhost|127\.0\.0\.1|YOUR-|REPLACE_|dummy/i.test(u.hostname+u.pathname))
         add(errors,"apiBase","仮のAPI URLが残っています");
     }catch(_){add(errors,"apiBase","API URLの形式が不正")}
   }
   if(!auth||auth==="unconfigured")add(errors,"authMode","認証方式が未設定");
   if(!tenant)add(warnings,"tenant","施設/テナント識別子が未設定");

   const result={
     at:new Date().toISOString(),
     schemaVersion:211,
     valid:errors.length===0,
     errors,warnings,
     environment:env||"unconfigured",
     authMode:auth||"unconfigured",
     tenantConfigured:!!tenant
   };
   try{localStorage.setItem(NagasakiSync.scopedKey("nagasaki-config-validation"),JSON.stringify(result))}catch(_){}
   SyncAudit.add("deployment-config-validation",{valid:result.valid,errorFields:errors.map(x=>x.field),warningFields:warnings.map(x=>x.field)});
   window.dispatchEvent(new CustomEvent("nagasaki:config-validation",{detail:result}));
   return result;
 }
};

const NagasakiEnvironmentFingerprint={
 async create(){
   try{
     const cfg=NagasakiDeploymentConfig.load();
     const raw=[
       String(cfg.environment||""),
       String(cfg.apiBase||""),
       String(cfg.authMode||""),
       String(cfg.tenant||""),
       "schema:204"
     ].join("|");
     let fingerprint="unavailable";
     if(crypto?.subtle){
       const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(raw));
       fingerprint=Array.from(new Uint8Array(buf)).slice(0,8).map(b=>b.toString(16).padStart(2,"0")).join("");
     }
     const state={at:new Date().toISOString(),schemaVersion:211,fingerprint,environment:cfg.environment||"unconfigured"};
     localStorage.setItem(NagasakiSync.scopedKey("nagasaki-environment-fingerprint"),JSON.stringify(state));
     SyncAudit.add("environment-fingerprint",{fingerprint,stateEnvironment:state.environment});
     return state;
   }catch(err){
     SyncAudit.add("environment-fingerprint-error",{message:String(err)});
     return null;
   }
 }
};

     schemaVersion:211,
     blockers,warnings,
     blockerCount:blockers.length,
     warningCount:warnings.length,

const NagasakiBuildIntegrity={
 release:"206-rc7",
 schemaVersion:211,
 expectedFiles:["index.html","manifest.webmanifest","sw.js"],
 async verifyRuntime(){

     at:new Date().toISOString(),
     release:this.release,

     manifestLinked:!!document.querySelector('link[rel="manifest"]'),

   };

const NagasakiReleaseFreeze={
 release:"211-rc12",
 schemaVersion:211,
 buildId:"nagasaki-211-rc12",
 verify(){
   const state={
     at:new Date().toISOString(),
     release:this.release,
     schemaVersion:this.schemaVersion,
     buildId:this.buildId,
     appSchema:Number(db?.schemaVersion||0),
     compatibilitySchema:Number(NagasakiCompatibility?.currentSchema||0),
     updateVersion:Number(NagasakiUpdateSafety?.version||0)
   };
   state.consistent=
     state.appSchema===this.schemaVersion &&
     state.compatibilitySchema===this.schemaVersion &&
     state.updateVersion===this.schemaVersion;
   try{localStorage.setItem(NagasakiSync.scopedKey("nagasaki-release-freeze"),JSON.stringify(state))}catch(_){}
   SyncAudit.add("release-freeze-check",{consistent:state.consistent,buildId:state.buildId});
   if(!state.consistent)window.dispatchEvent(new CustomEvent("nagasaki:release-freeze-error",{detail:state}));
   return state;
 }
};

const NagasakiRC9FreezeAudit={

 evaluate(){

   const result={
     at:new Date().toISOString(),
     release:this.release,
     schemaVersion:this.schemaVersion,
     frozenBuildConsistent:!!freeze?.consistent,
     configValid:!!config?.valid,
     realDeviceEvidence:`${tests?.passed||0}/${tests?.total||0}`,
     blockerCount:Number(blockers?.blockerCount||0),
     readyForProductionValidation:
       !!freeze?.consistent && !!config?.valid &&
       !!tests?.complete && Number(blockers?.blockerCount||0)===0
   };
   try{localStorage.setItem(NagasakiSync.scopedKey("nagasaki-rc9-freeze-audit"),JSON.stringify(result))}catch(_){}
   SyncAudit.add("rc9-freeze-audit",result);
   return result;
 }
};
