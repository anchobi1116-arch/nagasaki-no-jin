<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>長崎の陣｜犬の紐づけ申請テスト</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f3f5fa}*{box-sizing:border-box}body{margin:0}header{background:#111a2b;color:white;padding:22px 16px}main{max-width:850px;margin:24px auto;padding:0 14px}.card{background:white;border:1px solid #e1e5ec;border-radius:16px;padding:20px;margin:16px 0}.notice{background:#fff4de;padding:13px;border-radius:10px;font-size:14px}h1{font-size:22px;margin:0}h2{font-size:19px}input{padding:13px;border:1px solid #b9c6d9;border-radius:9px;font-size:16px;width:100%;margin:6px 0}button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 17px;background:#152239;color:white;cursor:pointer;margin:5px 6px 5px 0}button:disabled{opacity:.45;cursor:not-allowed}.muted{color:#57667a;font-size:13px}.dog{display:flex;gap:12px;align-items:center;border-bottom:1px solid #e5e8ed;padding:12px 2px}.dog input{width:19px;height:19px;flex:none}.dog small{display:block;color:#59667b}.list{max-height:365px;overflow-y:auto}.status{padding:10px;border-radius:9px;background:#eaf0f9;white-space:pre-wrap;overflow-wrap:anywhere}#afterLogin{display:none}#account{font-size:24px;font-weight:800;word-break:break-word}#pending{list-style:none;padding:0}#pending li{margin:8px 0;padding:10px;background:#f1f4f8;border-radius:8px}
</style></head><body><header><h1>🐺 長崎の陣｜自分の犬を登録</h1><div>Supabase接続・未公開テスト</div></header><main><div class="notice">🧪 実際に申請がクラウドに保存されるテストです。管理者の承認・犬プロフィール編集権限の付与はこの画面から行いません。本番の参加名簿は変更しません。</div>
<section id="authBox" class="card"><h2>① メールログイン</h2><p class="muted">ハスキー談話室でログイン済みなら、その状態を利用できます。同じHTTPSサイトで開いてください。</p><input id="email" type="email" autocomplete="email" placeholder="メールアドレス"><button id="send">ログインメールを送る</button><div id="authStatus" class="status" role="status">ログイン状態を確認中…</div></section>
<div id="afterLogin"><section class="card"><h2>② 自分の犬を選ぼう</h2><p class="muted">同じ名前の犬は生年月日と犬舎で確認してね。複数頭選べるよ。</p><input id="search" placeholder="犬の名前・犬舎を検索" aria-label="犬を検索"><div id="count" class="muted"></div><div id="dogs" class="list"></div></section><section class="card"><h2>③ 申請する</h2><div class="muted">承認後のアカウント名</div><div id="account">犬を選んでね</div><p class="muted">承認されるまでは犬の編集権限は付与されません。</p><button id="apply" disabled>この犬で紐づけを申請</button><div id="applyStatus" class="status" role="status">未申請</div><h2>自分の申請状況</h2><ul id="pending"></ul><button id="refresh">申請状況を更新</button></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const URL='https://slmeqqxjnzmflytzilnt.supabase.co',KEY='sb_publishable_Km0avobYKA96UOje47efcA_5g0VjpLH';const el=id=>document.getElementById(id),msg=(id,t)=>el(id).textContent=t;let sb,user,dogs=[],selected=new Set(),requests=[];
if(!window.supabase){msg('authStatus','ライブラリの読み込みに失敗しました。');return;}sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const esc=v=>String(v??'');async function initialize(){const {data,error}=await sb.auth.getUser();user=data?.user??null;if(error && !user)msg('authStatus',error.message);if(!user){el('afterLogin').style.display='none';if(!error)msg('authStatus','ログインしていません。メール認証してください。');return;}msg('authStatus','✅ ログイン中（メール認証済み）');el('afterLogin').style.display='block';await load();}
async function load(){msg('count','犬の一覧を読み込んでいます…');const {data,error}=await sb.rpc('dog_link_directory');if(error){msg('count','❌ 犬一覧の取得エラー：'+error.message);return;}dogs=data??[];render();await refresh();}
function render(){const q=el('search').value.toLocaleLowerCase().trim();const found=dogs.filter(d=>(d.name+' '+(d.kennel||'')).toLocaleLowerCase().includes(q));const box=el('dogs');box.replaceChildren();found.forEach(d=>{const label=document.createElement('label');label.className='dog';const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(d.id);check.addEventListener('change',()=>{if(check.checked)selected.add(d.id);else selected.delete(d.id);updateAccount();});const span=document.createElement('span'),strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=esc(d.name);small.textContent='誕生日：'+(d.birth_date||'不明')+' ／ 犬舎：'+(d.kennel||'不明')+' ／ '+(d.sex||'');span.append(strong,small);label.append(check,span);box.append(label);});msg('count',found.length+'頭表示 ／ 全'+dogs.length+'頭');updateAccount();}
function updateAccount(){const names=dogs.filter(d=>selected.has(d.id)).map(d=>d.name);msg('account',names.length?names.join('・'):'犬を選んでね');el('apply').disabled=!names.length;}
async function refresh(){const {data,error}=await sb.from('dog_link_requests').select('dog_id,status,requested_at').order('requested_at',{ascending:false});if(error){msg('applyStatus','申請状況取得エラー：'+error.message);return;}requests=data??[];const list=el('pending');list.replaceChildren();if(!requests.length){const li=document.createElement('li');li.textContent='まだ申請はありません';list.append(li);return;}requests.forEach(r=>{const d=dogs.find(d=>d.id===r.dog_id);const li=document.createElement('li');li.textContent=(d?.name||'犬ID: '+r.dog_id)+'：'+({pending:'🟠 承認待ち',approved:'✅ 承認済み',rejected:'❌ 却下'}[r.status]||r.status);list.append(li);});}
el('search').addEventListener('input',render);el('refresh').addEventListener('click',refresh);
el('send').addEventListener('click',async()=>{const email=el('email').value.trim();if(!email){msg('authStatus','メールアドレスを入力してね。');return;}el('send').disabled=true;const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});msg('authStatus',error?'❌ '+error.message:'✅ ログインメールを送ったよ。届いたリンクを開いてね。');el('send').disabled=false;});
el('apply').addEventListener('click',async()=>{if(!user)return;const ids=[...selected];if(!ids.length)return;el('apply').disabled=true;msg('applyStatus','申請を保存しています…');let successes=0,errors=[];for(const id of ids){if(requests.some(r=>r.dog_id===id)){continue;}const {error}=await sb.from('dog_link_requests').insert({dog_id:id,user_id:user.id});if(error)errors.push((dogs.find(d=>d.id===id)?.name||'犬')+'：'+error.message);else successes++;}msg('applyStatus',(successes?'✅ '+successes+'頭の紐づけ申請を保存したよ。管理者の承認待ちだよ。':'新しい申請はありません。')+(errors.length?'\n❌ '+errors.join('\n'):''));await refresh();el('apply').disabled=false;});
sb.auth.onAuthStateChange(()=>{setTimeout(initialize,0)});initialize();})();
</script></body></html>
